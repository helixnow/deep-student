<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <!-- A11Y: 允许用户缩放（WCAG 1.4.4），上限 5 倍；viewport-fit=cover 保留安全区域支持 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Deep Student</title>
    <!-- ★ 启动面样式：与 React 首帧（src/boot/BootShell.tsx）共用同一份
         public/boot.css，保证静态占位符 → React 的交接零视觉跳变。渲染阻塞加载，
         因此在首帧之前就把 boot 背景铺好，避免白闪。 -->
    <link rel="stylesheet" href="/boot.css" />
    <!-- ★ 启动前主题预判：外部文件以兼容 CSP script-src 'self'；为 boot 占位符选择深浅色 logo -->
    <script src="/boot-theme.js"></script>
    <!-- ★ 2026-02-04: 最早的全局错误过滤器 - 过滤 Tauri HTTP 插件的已知 bug。
         CSP script-src 只允许 self，内联脚本会被拦截，因此放在 public/error-filter.js。 -->
    <script src="/error-filter.js"></script>
  </head>

  <body>
    <div id="root">
      <div
        class="boot-loading"
        role="status"
        aria-label="Deep Student loading"
        data-dstu-react-placeholder="true"
      >
        <div class="boot-loading__logo-wrap">
          <img
            class="boot-loading__logo"
            src="/logo-black.svg"
            alt="Deep Student"
            width="60"
            height="60"
          />
          <img
            class="boot-loading__logo boot-loading__logo--shine"
            src="/logo-black.svg"
            alt=""
            aria-hidden="true"
            width="60"
            height="60"
          />
        </div>
      </div>
    </div>
    <!-- Shared portal root to stabilize overlays and prevent DOM reparenting issues -->
    <div id="unified-modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
