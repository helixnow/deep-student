name: CI
on:
  push:
    branches: [main, develop, nightly]
  pull_request:
    branches: [main, develop, nightly]
  workflow_dispatch: {}

# PR updates cancel obsolete work. Main commits retain their own verification:
# a subsequent push must not cancel the commit selected for a release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
env:
  DEEP_STUDENT_BUILD_NUMBER: '14639'

jobs:
  build-config:
    name: Build Configuration Contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --test scripts/__tests__/*.test.mjs
      - run: node scripts/generate-version.mjs --check

  plugin-consistency:
    name: Plugin Migration Consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test:plugins

  frontend-checks:
    name: Frontend · ${{ matrix.task }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/generate-version.mjs
      - name: Type check (authoritative tsc and tsgo)
        if: matrix.task == 'typecheck'
        run: |
          npx tsc --noEmit -p tsconfig.json > "$RUNNER_TEMP/tsc.log" 2>&1 &
          TSC_PID=$!
          npx tsgo --noEmit -p tsconfig.json > "$RUNNER_TEMP/tsgo.log" 2>&1 &
          TSGO_PID=$!
          TSC_CODE=0; wait "$TSC_PID" || TSC_CODE=$?
          TSGO_CODE=0; wait "$TSGO_PID" || TSGO_CODE=$?
          cat "$RUNNER_TEMP/tsc.log" "$RUNNER_TEMP/tsgo.log"
          test "$TSC_CODE" -eq 0 && test "$TSGO_CODE" -eq 0
      - if: matrix.task == 'lint'
        run: npm run lint && npm run licenses:check && npm run check:frontend-layers && npm run check:lint-ratchet
      - name: Build production bundle
        if: matrix.task == 'build'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite build && node scripts/ci/check-frontend-startup.mjs && node scripts/check-bundle-size.mjs --warn-only
      - name: npm audit (informational)
        if: matrix.task == 'lint'
        run: |
          npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-audit.txt" 2>&1 || echo '::warning::npm audit reported advisories'
          cat "$RUNNER_TEMP/npm-audit.txt" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: [frontend-checks]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.frontend-checks.result }}

  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/4)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Keep the orchestrator aligned with the 6GiB worker budget; transform /
      # result collection previously exhausted the default 4GiB main-process heap.
      NODE_OPTIONS: '--max-old-space-size=6144'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/generate-version.mjs
      - run: npx vitest run --shard=${{ matrix.shard }}/4 --logHeapUsage

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      provider-contract: ${{ steps.filter.outputs.provider-contract }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            provider-contract:
              - 'host/plugins/sync-providers/**'
              - 'host/plugins/sync/**'
              - 'host/plugins/backup/**'
              - 'host/platform/storage/**'
              - 'host/platform/secrets/**'
              - 'package-lock.json'
              - 'scripts/dev/docker-compose.sync-test.yml'
              - 'dstu-test/docker/**'
              - 'scripts/ci/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            all:
              - '**'
            docs:
              - '*.md'
              - 'docs/**'
      # Docs-only PRs skip the path-filtered gates. Pushes, mixed changes and a
      # missing answer all leave code != 'false', so those gates run.
      - name: Classify docs-only pull requests
        if: github.event_name == 'pull_request'
        id: classify
        env:
          ALL: ${{ steps.filter.outputs.all_count }}
          DOCS: ${{ steps.filter.outputs.docs_count }}
        run: |
          if [ "${ALL:-0}" -gt 0 ] && [ "$ALL" = "$DOCS" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  provider-contract:
    name: Cloud Provider Contract Gate (${{ matrix.provider }})
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.provider-contract == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [webdav, s3, ftp]
    env:
      DS_SYNC_TEST_DOCKER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Validate pinned provider composition
        run: |
          set -euo pipefail
          docker compose -f scripts/dev/docker-compose.sync-test.yml config --quiet
          IMAGES_FILE="$RUNNER_TEMP/provider-contract-images.txt"
          docker compose -f scripts/dev/docker-compose.sync-test.yml config --images > "$IMAGES_FILE"
          if grep -q ':latest$' "$IMAGES_FILE"; then
            echo '::error::Provider contract images must not use mutable latest tags'
            exit 1
          fi
      - name: Start healthy provider services
        run: |
          set -euo pipefail
          case "${{ matrix.provider }}" in
            s3) SERVICES=(minio); RUN_INIT=1 ;;
            webdav) SERVICES=(webdav); RUN_INIT=0 ;;
            ftp) SERVICES=(ftp); RUN_INIT=0 ;;
            *) exit 1 ;;
          esac
          docker compose -f scripts/dev/docker-compose.sync-test.yml up --detach --build --wait --wait-timeout 180 "${SERVICES[@]}"
          if [ "$RUN_INIT" = 1 ]; then
            docker compose -f scripts/dev/docker-compose.sync-test.yml run --rm minio-init
          fi
          for service in "${SERVICES[@]}"; do
            container_id="$(docker compose -f scripts/dev/docker-compose.sync-test.yml ps -q "$service")"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          done
      - name: Execute provider contract tests
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npx vitest run -c vitest.host.config.ts host/plugins/sync-providers/tests/sync_provider_contract.test.ts \
            -t '${{ matrix.provider }}_' --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/provider-contract.json"
          # A name filter that matches nothing, or a skipped suite, must not pass.
          node -e 'const r = require(process.argv[1]); if (!(r.numPassedTests > 0)) { console.error("no provider contract test ran"); process.exit(1); }' "$RUNNER_TEMP/provider-contract.json"
      - name: Provider service logs
        if: always()
        run: docker compose -f scripts/dev/docker-compose.sync-test.yml logs --no-color
      - name: Stop provider services
        if: always()
        run: docker compose -f scripts/dev/docker-compose.sync-test.yml down --volumes --remove-orphans

  migration-gate:
    name: Migration Gate (static + Host migration tests + fixtures)
    needs: [build-config, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Static migration gate and tooling tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/check-migrations.mjs --base-ref "origin/$BASE_REF"
          else
            node scripts/check-migrations.mjs
          fi
          node --test scripts/migration-ci/__tests__/*.test.mjs
      - name: Host migration tests
        run: >-
          npx vitest run -c vitest.host.config.ts
          host/platform/storage/tests/migration-compat.test.ts
          host/platform/storage/tests/migration-integration.test.ts
          host/plugins/backup/tests/migration-behavior.test.ts
          host/e2e/data-compat/migrations.test.ts
      - name: Fetch representative fixtures
        id: fixtures
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: bash scripts/migration-ci/fetch-fixtures.sh --tier representative --dest "$RUNNER_TEMP/migration-fixtures" --mode skip
      - name: Representative fixture upgrades
        if: steps.fixtures.outputs.fixtures_available == 'true'
        env:
          MIGRATION_FIXTURE_ROOT: ${{ steps.fixtures.outputs.fixture_root }}
          MIGRATION_GATE_MODE: upgrade
        run: npx vitest run -c vitest.host.config.ts host/platform/storage/tests/migration-integration.test.ts -t 'MIGRATION_FIXTURE_ROOT'

  required:
    name: CI Required
    if: always()
    needs: [build-config, plugin-consistency, frontend, frontend-tests, changes, provider-contract, migration-gate, examples]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Assert required results (only path-filtered jobs may skip)
        env:
          RESULTS: ${{ toJSON(needs) }}
          PROVIDER_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.provider-contract == 'true' }}
          CODE_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code != 'false' }}
        run: |
          node -e '
            const n = JSON.parse(process.env.RESULTS);
            for (const [k, v] of Object.entries(n)) {
              if (v.result === "skipped" && k === "provider-contract" && process.env.PROVIDER_REQUIRED !== "true") continue;
              if (v.result === "skipped" && k === "migration-gate" && process.env.CODE_REQUIRED !== "true") continue;
              if (v.result !== "success") throw Error(`${k}: ${v.result}`);
            }'

  examples:
    name: Community Plugin Examples
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/generate-version.mjs
      - name: Plugin manifest gate (no new findings)
        run: node scripts/electron-migration/gate-checks/plugin-manifest.mjs --check
      - name: Example plugin tests (examples/vitest.config.ts)
        run: npx vitest run -c examples/vitest.config.ts
