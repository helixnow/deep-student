name: CI
on:
  push:
    branches: [main, develop, nightly]
  pull_request:
    branches: [main, develop, nightly]
  workflow_dispatch: {}

# PR updates cancel obsolete work. Main commits retain their own verification:
# a subsequent push must not cancel the commit selected for a release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
env:
  DEEP_STUDENT_BUILD_NUMBER: '14639'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_IDLE_TIMEOUT: '0'
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'

jobs:
  build-config:
    name: Build Configuration Contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --test scripts/__tests__/*.test.mjs
      - run: env -u DEEP_STUDENT_BUILD_NUMBER node scripts/generate-version.mjs --check
      - name: Verify generation leaves tracked build config clean
        run: |
          mkdir -p src-tauri/gen/android/app
          : > src-tauri/gen/android/app/tauri.properties
          env -u DEEP_STUDENT_BUILD_NUMBER node scripts/generate-version.mjs
          ANDROID_VERSION_CODE="$(env -u DEEP_STUDENT_BUILD_NUMBER node scripts/generate-version.mjs --print-android-version-code)"
          grep -qx "tauri.android.versionCode=${ANDROID_VERSION_CODE}" src-tauri/gen/android/app/tauri.properties
          git diff --exit-code

  frontend-checks:
    name: Frontend · ${{ matrix.task }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/generate-version.mjs
      - name: Type check (authoritative tsc and tsgo)
        if: matrix.task == 'typecheck'
        run: |
          npx tsc --noEmit -p tsconfig.json > "$RUNNER_TEMP/tsc.log" 2>&1 &
          TSC_PID=$!
          npx tsgo --noEmit -p tsconfig.json > "$RUNNER_TEMP/tsgo.log" 2>&1 &
          TSGO_PID=$!
          TSC_CODE=0; wait "$TSC_PID" || TSC_CODE=$?
          TSGO_CODE=0; wait "$TSGO_PID" || TSGO_CODE=$?
          cat "$RUNNER_TEMP/tsc.log" "$RUNNER_TEMP/tsgo.log"
          test "$TSC_CODE" -eq 0 && test "$TSGO_CODE" -eq 0
      - if: matrix.task == 'lint'
        run: npm run lint && npm run licenses:check
      - name: Build production bundle
        if: matrix.task == 'build'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vite build && node scripts/check-bundle-size.mjs --warn-only
      - name: npm audit (informational)
        if: matrix.task == 'lint'
        run: |
          npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-audit.txt" 2>&1 || echo '::warning::npm audit reported advisories'
          cat "$RUNNER_TEMP/npm-audit.txt" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend
    needs: [frontend-checks]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.frontend-checks.result }}

  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/4)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/generate-version.mjs
      - run: npx vitest run --shard=${{ matrix.shard }}/4 --logHeapUsage

  backend:
    name: Backend
    needs: [build-config, frontend, frontend-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      # Formatting fails in seconds, before apt/cache setup or any compilation.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: ./.github/actions/setup-linux-rust
        with:
          cache-key: clippy
          components: clippy
      - name: Clippy (all targets, correctness deny)
        run: bash scripts/ci/with-resource-monitor.sh cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D clippy::correctness
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: resource-backend
          path: ${{ runner.temp }}/release-resource-metrics.log

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      provider-contract: ${{ steps.filter.outputs.provider-contract }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            provider-contract:
              - 'src-tauri/src/cloud_storage/**'
              - 'src-tauri/src/data_governance/**'
              - 'src-tauri/src/crypto/**'
              - 'src-tauri/tests/sync_provider_contract_tests.rs'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/Cargo.lock'
              - 'scripts/dev/docker-compose.sync-test.yml'
              - 'dstu-test/docker/**'
              - 'scripts/ci/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  rust-test-build:
    name: Rust Tests · Build Archive
    needs: [build-config, frontend, frontend-tests]
    runs-on: ${{ vars.LINUX_BUILD_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-linux-rust
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-nextest@0.9.145
      - name: Build and archive all test binaries (including ignored provider tests)
        working-directory: src-tauri
        run: bash ../scripts/ci/with-resource-monitor.sh cargo nextest archive --locked --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 7
          compression-level: 0
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: resource-rust-tests
          path: ${{ runner.temp }}/release-resource-metrics.log

  rust-tests:
    name: Rust Tests (${{ matrix.partition }}/8)
    needs: [rust-test-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      PROPTEST_CASES: '64'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-linux-rust
        with:
          resources: 'false'
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-nextest@0.9.145
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Run test partition
        working-directory: src-tauri
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/src-tauri" \
            --partition "hash:${{ matrix.partition }}/8" \
            -E 'not (binary(/_e2e$/) + binary(migration_fixture_upgrade_gate) + binary(mod))'

  provider-contract:
    name: Cloud Provider Contract Gate (${{ matrix.provider }})
    needs: [changes, rust-test-build]
    if: github.event_name != 'pull_request' || needs.changes.outputs.provider-contract == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        provider: [webdav, s3, ftp]
    env:
      DS_SYNC_TEST_DOCKER: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-linux-rust
        with:
          resources: 'false'
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-nextest@0.9.145
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - name: Validate pinned provider composition
        run: |
          set -euo pipefail
          docker compose -f scripts/dev/docker-compose.sync-test.yml config --quiet
          IMAGES_FILE="$RUNNER_TEMP/provider-contract-images.txt"
          docker compose -f scripts/dev/docker-compose.sync-test.yml config --images > "$IMAGES_FILE"
          if grep -q ':latest$' "$IMAGES_FILE"; then
            echo '::error::Provider contract images must not use mutable latest tags'
            exit 1
          fi
      - name: Start healthy provider services
        run: |
          set -euo pipefail
          case "${{ matrix.provider }}" in
            s3) SERVICES=(minio); RUN_INIT=1 ;;
            webdav) SERVICES=(webdav); RUN_INIT=0 ;;
            ftp) SERVICES=(ftp); RUN_INIT=0 ;;
            *) exit 1 ;;
          esac
          docker compose -f scripts/dev/docker-compose.sync-test.yml up --detach --build --wait --wait-timeout 180 "${SERVICES[@]}"
          if [ "$RUN_INIT" = 1 ]; then
            docker compose -f scripts/dev/docker-compose.sync-test.yml run --rm minio-init
          fi
          for service in "${SERVICES[@]}"; do
            container_id="$(docker compose -f scripts/dev/docker-compose.sync-test.yml ps -q "$service")"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          done
      - name: Execute ignored provider tests from the archive (no Cargo compilation)
        working-directory: src-tauri
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/src-tauri" \
            --run-ignored only --test-threads 1 --no-tests fail \
            -E 'binary(=sync_provider_contract_tests) & test(/^${{ matrix.provider }}_/)'
      - name: Provider service logs
        if: always()
        run: docker compose -f scripts/dev/docker-compose.sync-test.yml logs --no-color
      - name: Stop provider services
        if: always()
        run: docker compose -f scripts/dev/docker-compose.sync-test.yml down --volumes --remove-orphans

  windows-shell-sandbox:
    name: Windows Shell Sandbox
    needs: [build-config, frontend, frontend-tests]
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.98.1'
      - uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        continue-on-error: true
      - shell: bash
        run: bash scripts/ci/prepare-sccache.sh
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Enforce AppContainer filesystem boundary
        working-directory: src-tauri
        run: cargo test --locked --lib chat_v2::tools::shell_sandbox::windows::tests -- --nocapture
      - name: Exercise Windows shell helper end to end
        working-directory: src-tauri
        run: cargo test --locked --test windows_shell_helper_e2e -- --nocapture

  migration-gate:
    name: Migration Gate (static + production tests + fixtures)
    needs: [build-config, frontend, frontend-tests]
    runs-on: ${{ vars.LINUX_BUILD_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Static migration gate and tooling tests
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/check-migrations.mjs --base-ref "origin/$BASE_REF"
          else
            node scripts/check-migrations.mjs
          fi
          node --test scripts/migration-ci/__tests__/*.test.mjs
      - uses: ./.github/actions/setup-linux-rust
      - name: Production migration tests
        run: bash scripts/ci/with-resource-monitor.sh bash scripts/migration-ci/run-migration-tests.sh --min-tests 50
      - name: Fetch representative fixtures
        id: fixtures
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: bash scripts/migration-ci/fetch-fixtures.sh --tier representative --dest "$RUNNER_TEMP/migration-fixtures" --mode skip
      - name: Representative fixture upgrades
        if: steps.fixtures.outputs.fixtures_available == 'true'
        run: |
          bash scripts/ci/with-resource-monitor.sh bash scripts/migration-ci/run-fixture-upgrades.sh \
            --fixture-root "${{ steps.fixtures.outputs.fixture_root }}" --mode upgrade \
            --report "$RUNNER_TEMP/migration-reports/representative-upgrade.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: migration-gate-fixture-report
          path: |
            ${{ runner.temp }}/migration-reports/
            ${{ runner.temp }}/release-resource-metrics.log
          retention-days: 14

  security-audit:
    name: Security Audit
    # Informational includes the advisory tool's availability, not just its
    # exit code. A registry outage here must not invalidate CI Required.
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-audit
      - name: Cargo audit (informational)
        working-directory: src-tauri
        run: |
          cargo audit > "$RUNNER_TEMP/audit.txt" 2>&1 || echo '::warning::cargo audit reported advisories'
          cat "$RUNNER_TEMP/audit.txt" >> "$GITHUB_STEP_SUMMARY"

  required:
    name: CI Required
    if: always()
    needs: [build-config, frontend, frontend-tests, backend, changes, rust-tests, provider-contract, windows-shell-sandbox, migration-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Assert required results (only path-filtered provider tests may skip)
        env:
          RESULTS: ${{ toJSON(needs) }}
          PROVIDER_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.provider-contract == 'true' }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS); for(const [k,v] of Object.entries(n)){if(k==="provider-contract" && process.env.PROVIDER_REQUIRED!=="true" && v.result==="skipped")continue; if(v.result!=="success")throw Error(`${k}: ${v.result}`)}'
