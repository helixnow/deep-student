name: CI

on:
  push:
    branches: [main, develop, nightly]
  pull_request:
    branches: [main, develop, nightly]

# 取消同一分支上的重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 非 release job 统一注入确定性构建号，保持默认浅 checkout 便宜。
# （审查 F16：此前该值在 3 个文件里重复 10 处，改契约要改 10 处）
env:
  DEEP_STUDENT_BUILD_NUMBER: '14636'

jobs:
  # Only this contract job needs full history. Non-release jobs use the
  # workflow-level DEEP_STUDENT_BUILD_NUMBER above.
  # Stable release metadata and clean-runner Cargo configuration.
  build-config:
    name: Build Configuration Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Test version and proxy contracts
        run: node --test scripts/__tests__/*.test.mjs

      # env -u：本 job 校验"从完整 git 历史推导构建号"的真实路径，
      # 必须剥掉 workflow 级注入的确定性构建号
      - name: Validate generated Android versionCode
        run: env -u DEEP_STUDENT_BUILD_NUMBER node scripts/generate-version.mjs --check

      - name: Verify generation leaves tracked build config clean
        run: |
          mkdir -p src-tauri/gen/android/app
          : > src-tauri/gen/android/app/tauri.properties
          env -u DEEP_STUDENT_BUILD_NUMBER node scripts/generate-version.mjs
          ANDROID_VERSION_CODE="$(env -u DEEP_STUDENT_BUILD_NUMBER node scripts/generate-version.mjs --print-android-version-code)"
          grep -qx "tauri.android.versionCode=${ANDROID_VERSION_CODE}" src-tauri/gen/android/app/tauri.properties
          git diff --exit-code

  # ============================================
  # 前端编译检查 + 产物构建
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Verify third-party license notices
        run: npm run licenses:check

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint, errors block merge)
        run: npm run lint

      # 审查 F13：tsc 通过不代表 vite build 能过（rollup 解析、动态 import、
      # 资源引用、chunk 配置）。此前第一次构建产物发生在合并 Release PR 之后
      # 的全平台发布里 —— 失败即阻塞发布。左移到 PR。
      - name: Build production bundle
        run: npx vite build

      # 审查 F11：此前 `npm audit || true` 永远绿灯且无人看日志。
      # 保持非阻塞（npm 无 audit.toml 式忽略清单，深层传递依赖难以升级），
      # 但结果写入 job summary，红字可见。
      - name: Security audit (npm, informational)
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/npm-audit.txt" 2>&1
          CODE=$?
          set -e
          {
            echo "## npm audit (--omit=dev, audit-level=high)"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/npm-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/npm-audit.txt"
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::npm audit found high+ vulnerabilities (informational, see job summary)"
          fi

  # ============================================
  # 前端单元测试（Vitest）
  #
  # 战略审计 2026-07-04 P0 接入：此前 ~1.7k 条 vitest 用例只在本地跑，
  # CI 完全没有前端测试信号。维护者转入兼职模式后，这是外部贡献者 PR
  # 的第一道回归防线。
  #
  # vitest.config.ts 为规避 Node22 tinypool 崩溃使用 forks 多进程池
  # （不要改回 singleFork：单进程串行会因 jsdom 内存跨文件累积触发
  # GC 抖动近似死锁，分片会卡死直到 45 分钟超时）。4 路分片并行跑。
  # ============================================
  frontend-tests:
    name: Frontend Tests (Vitest ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Run vitest shard
        run: npx vitest run --shard=${{ matrix.shard }}/4

  # ============================================
  # 后端静态检查（fmt + clippy）
  #
  # 审查 F14：移除了与 clippy 重复编译的 cargo check；补上此前装了组件
  # 却从不执行的 rustfmt 检查；clippy 扩展到 --all-targets，让 tests/
  # 下的集成测试代码也过 lint。
  # ============================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          shared-key: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      # build.rs 的 Tauri ACL 校验要求 Linux 侧存在 libpdfium.so（2026-08-06
      # 起 Linux 版 PDF/OCR 补齐），CI 工作区未随仓库提交该二进制，必须预先下载。
      - name: Prepare target-specific pdfium
        run: |
          if [ -f "src-tauri/resources/pdfium/libpdfium.so" ]; then
            echo "Using existing pdfium: $(ls -lh src-tauri/resources/pdfium/libpdfium.so | awk '{print $5}')"
          else
            bash scripts/download-pdfium.sh linux-x64
          fi
          test -f "src-tauri/resources/pdfium/libpdfium.so" || { echo "::error::libpdfium.so missing after prepare"; exit 1; }

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      # W0–W1 clippy gate (C3): Cargo.toml [lints.clippy] sets correctness=deny
      # and style=warn (+ allow-listed debt). CLI -D correctness is belt-and-suspenders;
      # do not pass -W clippy::style here (would override per-lint allows).
      - name: Clippy (all targets, correctness deny)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::correctness

  # Real provider behavior is a required contract, not an optional local check.
  # This job deliberately runs every ignored test in sync_provider_contract_tests.
  provider-contract:
    name: Cloud Provider Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      DS_SYNC_TEST_DOCKER: '1'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          shared-key: provider-contract

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - name: Prepare target-specific pdfium
        run: |
          if [ -f "src-tauri/resources/pdfium/libpdfium.so" ]; then
            echo "Using existing pdfium: $(ls -lh src-tauri/resources/pdfium/libpdfium.so | awk '{print $5}')"
          else
            bash scripts/download-pdfium.sh linux-x64
          fi
          test -f "src-tauri/resources/pdfium/libpdfium.so" || { echo "::error::libpdfium.so missing after prepare"; exit 1; }

      - name: Validate pinned provider composition
        run: |
          set -euo pipefail
          docker compose -f scripts/dev/docker-compose.sync-test.yml config --quiet
          IMAGES_FILE="$RUNNER_TEMP/provider-contract-images.txt"
          docker compose -f scripts/dev/docker-compose.sync-test.yml config --images > "$IMAGES_FILE"
          test "$(awk 'NF { count++ } END { print count+0 }' "$IMAGES_FILE")" -ge 4
          if awk '/:latest$/ { found=1 } END { exit(found ? 0 : 1) }' "$IMAGES_FILE"; then
            echo "::error::Provider contract images must not use mutable latest tags"
            exit 1
          fi

      - name: Start healthy provider services
        run: |
          set -euo pipefail
          docker compose -f scripts/dev/docker-compose.sync-test.yml \
            up --detach --build --wait --wait-timeout 180 minio webdav ftp
          docker compose -f scripts/dev/docker-compose.sync-test.yml run --rm minio-init
          for service in minio webdav ftp; do
            container_id="$(docker compose -f scripts/dev/docker-compose.sync-test.yml ps -q "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy
          done

      - name: Run every provider contract test
        working-directory: src-tauri
        run: |
          set -euo pipefail
          LIST_FILE="$RUNNER_TEMP/provider-contract-tests.txt"
          RUN_FILE="$RUNNER_TEMP/provider-contract-run.txt"

          # Write the complete harness list before parsing it. Avoid a
          # cargo|filter pipeline whose downstream close/truncation could hide
          # tests or turn a broken stream into a misleading count.
          cargo test --test sync_provider_contract_tests -- --ignored --list > "$LIST_FILE"
          TEST_COUNT="$(awk '/: test$/ { count++ } END { print count+0 }' "$LIST_FILE")"
          LIST_SUMMARY_COUNT="$(
            awk '/^[0-9]+ tests?, 0 benchmarks$/ { summaries++; listed=$1 }
                 END {
                   if (summaries != 1) exit 2;
                   print listed+0
                 }' "$LIST_FILE"
          )"
          if [ "$TEST_COUNT" -le 0 ]; then
            echo "::error::sync_provider_contract_tests selected zero ignored tests"
            exit 1
          fi
          if [ "$TEST_COUNT" -ne "$LIST_SUMMARY_COUNT" ]; then
            echo "::error::Provider contract list was truncated or malformed: parsed=$TEST_COUNT summary=$LIST_SUMMARY_COUNT"
            exit 1
          fi
          for provider in webdav s3 ftp; do
            if ! awk -v prefix="${provider}_" \
              'index($0, prefix) == 1 && /: test$/ { found=1 } END { exit(found ? 0 : 1) }' \
              "$LIST_FILE"; then
              echo "::error::Provider contract list contains no ${provider} tests"
              exit 1
            fi
          done

          echo "Running $TEST_COUNT provider contract tests"
          cargo test --test sync_provider_contract_tests -- --ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUN_FILE"
          PASSED_COUNT="$(
            awk '/^test result: ok\./ { summaries++; passed=$4 }
                 END {
                   if (summaries != 1) exit 2;
                   print passed+0
                 }' "$RUN_FILE"
          )"
          if [ "$PASSED_COUNT" -ne "$TEST_COUNT" ]; then
            echo "::error::Not every listed provider contract ran: listed=$TEST_COUNT passed=$PASSED_COUNT"
            exit 1
          fi

      - name: Provider service logs
        if: always()
        run: docker compose -f scripts/dev/docker-compose.sync-test.yml logs --no-color

      - name: Stop provider services
        if: always()
        run: docker compose -f scripts/dev/docker-compose.sync-test.yml down --volumes --remove-orphans

  windows-shell-sandbox:
    name: Windows Shell Sandbox
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Compile Windows backend
        working-directory: src-tauri
        run: cargo check --lib

      - name: Enforce AppContainer filesystem boundary
        working-directory: src-tauri
        run: cargo test --lib chat_v2::tools::shell_sandbox::windows::tests -- --nocapture

  # ============================================
  # Rust 测试：一次编译 + 分片执行（cargo-nextest archive）
  #
  # 审查 F8/F9/F10 重构（2026-07-19）：
  #   - 此前 sync-tests(14) + integration-tests(8) + lib-unit-tests(1) 共
  #     23 个 job 各自从零编译整个依赖图（每次 push ~500 Linux 分钟），
  #     且 rust-cache 误用 `key:`（不共享），23 份 1-2GB 缓存互相驱逐。
  #   - 此前矩阵是手工维护的文件名清单，新增 tests/*.rs 默认不进 CI
  #     （审阅 35 P0-2 曾漏掉 5 个 sync 目标）。
  #   - 现在：rust-test-build 用 nextest archive 编译打包全部测试二进制
  #     （新 test target 自动纳入，无需登记）；rust-tests 矩阵只下载执行，
  #     按 hash 分 8 片。失败定位能力不变（nextest 按 test 报告）。
  #
  # 显式排除清单（唯一的人工维护点，排除是可见的，不是静默漏跑）：
  #   - *_e2e            harness=false 的 executor E2E（依赖真实环境，
  #                      从未在 CI 运行；接入前需先解决其外部依赖）
  #   - migration_fixture_upgrade_gate  需要 MIGRATION_FIXTURE_ROOT env，
  #                      仅在 migration 门禁 harness 中有意义（fail-closed）
  #   - mod              tests/mod.rs 历史遗留，内容与独立 target 重复
  # ============================================
  rust-test-build:
    name: Rust Tests · Build Archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      # shared-key（而非 key）才是跨 job 共享缓存的正确参数（审查 F8）；
      # 与 migration-gate / migration-nightly 共用同一份编译缓存。
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          shared-key: tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest

      - name: Prepare target-specific pdfium
        run: |
          if [ -f "src-tauri/resources/pdfium/libpdfium.so" ]; then
            echo "Using existing pdfium: $(ls -lh src-tauri/resources/pdfium/libpdfium.so | awk '{print $5}')"
          else
            bash scripts/download-pdfium.sh linux-x64
          fi
          test -f "src-tauri/resources/pdfium/libpdfium.so" || { echo "::error::libpdfium.so missing after prepare"; exit 1; }

      - name: Build and archive all test binaries
        working-directory: src-tauri
        run: cargo nextest archive --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          retention-days: 1

  rust-tests:
    name: Rust Tests (${{ matrix.partition }}/8)
    needs: [rust-test-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # proptest 在 CI 里用随机种子；固定用例数（64）控制单 case 时长
      PROPTEST_CASES: '64'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      # 运行期共享库（webkit2gtk 等），无需编译缓存
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nextest-archive
          path: ${{ runner.temp }}

      - name: Run test partition
        working-directory: src-tauri
        run: |
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE/src-tauri" \
            --partition "hash:${{ matrix.partition }}/8" \
            -E 'not (binary(/_e2e$/) + binary(migration_fixture_upgrade_gate) + binary(mod))'

  # ============================================
  # 数据库迁移门禁（PR 层）
  #
  # 分层设计（详见 scripts/migration-ci/README.md）：
  #   PR/branch push（本 job）: 静态门禁 + 生产 data_governance 迁移测试
  #     （显式要求非零测试数，替代已移除的 migration_tests 假绿目标）
  #     + 代表性 fixture 升级（无 fixture secret 时显式跳过，如 fork PR）
  #   main/nightly: migration-nightly.yml（全量 fixture + 故障注入 + 规模）
  #   release/rebuild: reusable-migration-gate.yml（fail-closed）
  # ============================================
  migration-gate:
    name: Migration Gate (static + production tests + fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      # fetch-depth: 0 —— 静态门禁的 --base-ref 不可变性校验需要 base 分支历史
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Static migration gate (lock manifest + dangerous SQL)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/check-migrations.mjs --base-ref "origin/${{ github.base_ref }}"
          else
            node scripts/check-migrations.mjs
          fi

      - name: Migration CI tooling self-tests
        run: node --test scripts/migration-ci/__tests__/*.test.mjs

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
          shared-key: tests

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler

      # 生产统一迁移框架测试（src/data_governance/migration*），
      # run-migration-tests.sh 解析 cargo 汇总并强制通过数 >= --min-tests，
      # 杜绝 "0 passed; 0 failed" 假绿。
      - name: Prepare target-specific pdfium
        run: |
          if [ -f "src-tauri/resources/pdfium/libpdfium.so" ]; then
            echo "Using existing pdfium: $(ls -lh src-tauri/resources/pdfium/libpdfium.so | awk '{print $5}')"
          else
            bash scripts/download-pdfium.sh linux-x64
          fi
          test -f "src-tauri/resources/pdfium/libpdfium.so" || { echo "::error::libpdfium.so missing after prepare"; exit 1; }

      - name: Production migration tests (non-zero count enforced)
        run: bash scripts/migration-ci/run-migration-tests.sh --min-tests 50

      # 代表性 fixture 升级。fixture 来自私有归档 secret；fork PR 拿不到
      # secret 时 fetch-fixtures.sh --mode skip 输出 fixtures_available=false
      # 并显式打 warning —— 跳过是可见的，不是假绿。
      - name: Fetch representative fixtures
        id: fixtures
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: |
          bash scripts/migration-ci/fetch-fixtures.sh \
            --tier representative --dest "$RUNNER_TEMP/migration-fixtures" --mode skip

      - name: Representative fixture upgrades
        if: steps.fixtures.outputs.fixtures_available == 'true'
        run: |
          bash scripts/migration-ci/run-fixture-upgrades.sh \
            --fixture-root "${{ steps.fixtures.outputs.fixture_root }}" \
            --mode upgrade \
            --report "$RUNNER_TEMP/migration-reports/representative-upgrade.jsonl"

      - name: Upload fixture upgrade report
        if: steps.fixtures.outputs.fixtures_available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-gate-fixture-report
          path: ${{ runner.temp }}/migration-reports/
          retention-days: 14

  # ============================================
  # 供应链安全审计
  #
  # 审查 F11：此前 `cargo audit || true` 永远绿灯且无人看日志（纯摆设），
  # 每次还从源码 cargo install（3-5 分钟）。现在用预编译二进制秒装，
  # 结果写入 job summary + warning 注解，红字可见。
  #
  # 仍为非阻塞：2026-07-19 本地核实存量 29 个 advisory 全部位于深层传递
  # 依赖（aws-lc-sys / rustls-webpki / quick-xml / quinn-proto / GTK 系等），
  # 无法在不做大版本升级的前提下修复。转为阻塞的前提：清完存量或将其
  # 全部收编进 src-tauri/.cargo/audit.toml 忽略清单（带理由注释）。
  # ============================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-audit

      - name: Cargo audit (informational; ignores in src-tauri/.cargo/audit.toml)
        working-directory: src-tauri
        run: |
          set +e
          cargo audit > "$RUNNER_TEMP/cargo-audit.txt" 2>&1
          CODE=$?
          set -e
          {
            echo "## cargo audit"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/cargo-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/cargo-audit.txt"
          if [ "$CODE" -ne 0 ]; then
            echo "::warning::cargo audit found advisories (informational; see job summary and src-tauri/.cargo/audit.toml)"
          fi
