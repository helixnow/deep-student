# macOS Electron release build (arm64 + x64, signed + notarized + stapled + minisign)
name: Build macOS (reusable)

on:
  workflow_call:
    inputs:
      force_rebuild:
        default: false
        type: boolean
      targets:
        description: Native target matrix
        type: string
        default: '[{"target":"aarch64-apple-darwin","arch":"arm64","runner":"macos-15"},{"target":"x86_64-apple-darwin","arch":"x64","runner":"macos-15-intel"}]'
      source_sha:
        description: 'Immutable 40-char source commit SHA'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Release tag (e.g. v0.20.0)'
        required: true
        type: string
      allow_unsigned:
        description: 'Manual recovery only: allow ad-hoc signing without Apple Developer ID/notarization'
        required: false
        type: boolean
        default: false
      frontend_dist_artifact:
        description: 'Prebuilt frontend dist artifact name; builds locally when empty'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RELEASE_FORCE_REBUILD: ${{ inputs.force_rebuild }}
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: '--max-old-space-size=4096'
      ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
      ELECTRON_CUSTOM_DIR: '{{ version }}'
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      - name: Preflight — require signing and updater secrets (fail-closed)
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          MISSING=""
          for VAR in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then MISSING="${MISSING} ${VAR}"; fi
          done
          if [ "$ALLOW_UNSIGNED" != "true" ]; then
            for VAR in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID; do
              if [ -z "${!VAR}" ]; then MISSING="${MISSING} ${VAR}"; fi
            done
            if [ -z "${APPLE_APP_SPECIFIC_PASSWORD}" ] && [ -z "${APPLE_PASSWORD}" ]; then
              MISSING="${MISSING} APPLE_PASSWORD/APPLE_APP_SPECIFIC_PASSWORD"
            fi
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::macOS release build missing required secrets:${MISSING}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || inputs.tag_name }}

      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/ci
            .github/actions

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Verify pinned release source before installing dependencies
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs source

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild better-sqlite3 for Electron
        run: |
          ARCH="${{ matrix.arch }}"
          if [ -z "$ARCH" ]; then
            case "${{ matrix.target }}" in
              aarch64-*) ARCH="arm64" ;;
              x86_64-*) ARCH="x64" ;;
              *) echo "::error::Unknown target ${{ matrix.target }}"; exit 1 ;;
            esac
          fi
          npx @electron/rebuild -f -w better-sqlite3 --arch="$ARCH"

      - name: Install Electron binary
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "electron download failed (attempt ${attempt}/3), retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Download prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.frontend_dist_artifact }}
          path: dist

      - name: Verify prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        run: |
          test -f dist/index.html || { echo "::error::Prebuilt frontend dist missing index.html"; exit 1; }
          echo "Prebuilt frontend dist ready ($(find dist -type f | wc -l | tr -d ' ') files)"

      - name: Verify prebuilt frontend identity and contents
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-check --dir dist

      - name: Build frontend locally (fallback)
        if: ${{ inputs.frontend_dist_artifact == '' }}
        run: npm run build

      - name: Import Apple signing certificate
        if: ${{ !inputs.allow_unsigned }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/deepstudent-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 decoded to an empty file"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::Imported certificate does not match APPLE_SIGNING_IDENTITY ('${APPLE_SIGNING_IDENTITY}')"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "Developer ID certificate imported into temporary keychain"

      - name: Package macOS Electron app (signed + notarized + .app.tar.gz)
        env:
          CSC_NAME: ${{ !inputs.allow_unsigned && secrets.APPLE_SIGNING_IDENTITY || '' }}
          CSC_KEYCHAIN: ${{ !inputs.allow_unsigned && env.KEYCHAIN_PATH || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.allow_unsigned && 'false' || 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          if [ -z "$ARCH" ]; then
            case "${{ matrix.target }}" in
              aarch64-*) ARCH="arm64" ;;
              x86_64-*) ARCH="x64" ;;
            esac
          fi
          for attempt in 1 2 3; do
            if node electron/scripts/package.mjs --mac --"$ARCH"; then exit 0; fi
            echo "packaging failed (attempt ${attempt}/3), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Verify fuses and asar integrity
        run: |
          set -euo pipefail
          APP_DIR=$(find release -maxdepth 2 -type d -name '*.app' | head -n 1)
          test -n "$APP_DIR"
          node electron/scripts/verify-fuses.mjs --mac --app "$APP_DIR" --static

      - name: Verify codesign / notarization / staple / Gatekeeper
        if: ${{ !inputs.allow_unsigned }}
        run: |
          set -euo pipefail
          APP_DIR=$(find release -maxdepth 2 -type d -name '*.app' | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found under release/"
            exit 1
          fi
          echo "Verifying: $APP_DIR"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"
          if ! codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "::error::.app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          xcrun stapler validate "$APP_DIR"
          spctl --assess --type execute --verbose=2 "$APP_DIR"

          DMG=$(find release -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found under release/"
            exit 1
          fi
          codesign --verify --verbose=2 "$DMG"
          echo "codesign + notarization + staple + Gatekeeper checks all passed"

      - name: Sign updater archive with minisign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAR=$(find release -maxdepth 1 -name '*.app.tar.gz' ! -name '*.sig' | head -n 1)
          if [ -z "$TAR" ]; then
            echo "::error::No .app.tar.gz updater archive found under release/"
            ls -la release/ || true
            exit 1
          fi
          node .release-tooling/scripts/ci/sign-updater.mjs "$TAR"
          test -s "${TAR}.sig"

      - name: Verify updater archive, signature, and DMG exist
        run: |
          set -euo pipefail
          TAR_COUNT=$(find release -maxdepth 1 -name '*.app.tar.gz' ! -name '*.sig' | wc -l | tr -d ' ')
          SIG_COUNT=$(find release -maxdepth 1 -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')
          DMG_COUNT=$(find release -maxdepth 1 -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$TAR_COUNT" -ne 1 ] || [ "$SIG_COUNT" -ne 1 ] || [ "$DMG_COUNT" -ne 1 ]; then
            echo "::error::Expected 1 .app.tar.gz, 1 .sig, 1 .dmg; got ${TAR_COUNT}/${SIG_COUNT}/${DMG_COUNT}"
            ls -la release/ || true
            exit 1
          fi

      - name: Cleanup temporary keychain
        if: ${{ always() && !inputs.allow_unsigned && env.KEYCHAIN_PATH != '' }}
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Stage macOS release deliverables
        run: |
          mkdir -p macos-output
          cp release/*.dmg macos-output/
          cp release/*.app.tar.gz macos-output/
          cp release/*.app.tar.gz.sig macos-output/

      - name: Record locally built frontend identity
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact == '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-write --dir dist

      - name: Record release asset provenance
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARTIFACT_DIR: macos-output
        run: >-
          node .release-tooling/scripts/ci/release-contracts.mjs provenance-write
          --target "$RELEASE_TARGET" --dir "$RELEASE_ARTIFACT_DIR"
          --output "$RUNNER_TEMP/release-provenance.json"

      - name: Upload release asset provenance
        if: ${{ inputs.source_sha != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-provenance-${{ matrix.target }}
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
          overwrite: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          overwrite: true
          name: macos-${{ matrix.target }}
          retention-days: 30
          compression-level: 0
          path: macos-output/*

      - uses: ./.release-tooling/.github/actions/release-checkpoint
        if: inputs.source_sha != ''
        with:
          stage: ${{ matrix.target == 'aarch64-apple-darwin' && 'macos-arm' || 'macos-intel' }}
          policy: ${{ inputs.allow_unsigned }}
