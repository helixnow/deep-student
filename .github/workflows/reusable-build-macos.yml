# macOS 构建（reusable）
#
# release.yml / rebuild-release.yml 共用的唯一 macOS 构建实现。
# 调用方需 `secrets: inherit`。
#
# 审查 F4 修复：APPLE_* 签名/公证 secrets 此前只写在 release.yml 头部注释里，
# 从未传入构建环境 —— Tauri 只从 env 读取这些配置，导致产物一直是 ad-hoc
# 签名、未公证。现已显式注入。
#
# 生产签名链（fail-closed）：
#   1. Preflight 校验全部生产 secrets（缺失 ⇒ 立即失败并列出缺失项，
#      绝不静默产出 ad-hoc 签名/未公证产物）
#   2. 导入 Developer ID Application 证书到独立临时 keychain
#   3. tauri build：codesign（APPLE_SIGNING_IDENTITY）+ notarytool 公证
#      + staple（APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID）
#   4. 构建后强制验证：codesign --verify --strict、xcrun stapler validate、
#      spctl --assess（Gatekeeper 通过才算构建成功）
#   5. 无论成败清理临时 keychain
#
# 需要的生产 secrets：
#   APPLE_CERTIFICATE_BASE64（Developer ID Application .p12 的 base64）
#   APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD（app-specific password）/ APPLE_TEAM_ID
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD（updater 签名）

name: Build macOS (reusable)

on:
  workflow_call:
    inputs:
      tag_name:
        description: '构建的 tag（如 v0.9.42）'
        required: true
        type: string
      allow_unsigned:
        description: '仅供手动恢复发布：缺少 Apple 生产签名凭据时允许未公证构建'
        required: false
        default: false
        type: boolean
      frontend_dist_artifact:
        description: 'WI-4: 预构建前端 dist 的 artifact 名称；留空则由 beforeBuildCommand 在本 job 内构建前端'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # 固定工具版本（升级需显式改这里）
  SENTRY_CLI_VERSION: '2.58.6'

jobs:
  build:
    # macos-latest is ARM64. Running the Intel target there forces a very slow
    # cross-architecture release build, so each target must use its native host.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      SENTRY_UPLOAD_ENABLED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && 'true' || 'false' }}
      # The repository release profile uses one codegen unit + ThinLTO + packed
      # debug info. On standard hosted macOS runners that made the final rustc /
      # dSYM phase exceed three hours. Keep symbols only when they can actually
      # be uploaded, and favor a bounded, reproducible release build otherwise.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && '1' || '0' }}
      CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && 'packed' || 'off' }}
      # sccache（GHA cache 后端）与 rust-cache 叠加：rust-cache 负责 registry/
      # git 依赖与 target 目录整体缓存，sccache 按编译单元缓存 rustc 输出，
      # 依赖版本或 profile 变化导致 rust-cache miss 时仍可大量命中。
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      # ── 生产签名 secrets 预检（fail-closed, 在任何耗时步骤之前）──
      - name: Preflight — require production signing secrets (fail-closed)
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && '1' || '0' }}
        run: |
          MISSING=""
          REQUIRED_VARS="TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          if [ "$ALLOW_UNSIGNED" != "1" ]; then
            REQUIRED_VARS="APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID $REQUIRED_VARS"
          fi
          for VAR in $REQUIRED_VARS; do
            if [ -z "${!VAR}" ]; then
              MISSING="${MISSING} ${VAR}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::macOS release build refuses to run without production signing secrets (fail-closed)."
            echo "::error::Missing secrets:${MISSING}"
            echo "::error::Configure them in repository/organization secrets. Unsigned builds are only allowed via local scripts (e.g. scripts/build_all.sh with DS_ALLOW_UNSIGNED=1)."
            exit 1
          fi
          if [ "$ALLOW_UNSIGNED" = "1" ]; then
            echo "::warning::Building macOS without Developer ID signing or Apple notarization under an explicit manual rebuild override."
            exit 0
          fi
          echo "✅ All required macOS production signing secrets are present"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Overlay release pdfium tooling from workflow revision
        run: |
          WORKFLOW_SHA="${{ github.sha }}"
          for FILE in \
            scripts/download-pdfium.sh \
            scripts/prepare-pdfium-macos.sh \
            scripts/verify-macos-pdfium-bundle.sh
          do
            git cat-file -e "${WORKFLOW_SHA}:${FILE}" || {
              echo "::error::Missing ${FILE} at workflow revision ${WORKFLOW_SHA}"
              exit 1
            }
            git show "${WORKFLOW_SHA}:${FILE}" > "${FILE}"
            chmod +x "${FILE}"
          done
          echo "✅ Overlaid macOS pdfium release tooling from ${WORKFLOW_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # 必须先于任何 cargo 调用：RUSTC_WRAPPER 是 job 级 env，
      # sccache 二进制不存在时 cargo 会直接报错。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Refresh release lock metadata and third-party notices
        run: |
          (cd src-tauri && cargo metadata --format-version 1 > /dev/null)
          npm run licenses:generate

      - name: Install Sentry CLI (pinned)
        if: ${{ env.SENTRY_UPLOAD_ENABLED == 'true' }}
        run: npm install --global "@sentry/cli@${SENTRY_CLI_VERSION}"

      - name: Print build tool manifest
        run: |
          echo "=== macOS build tool manifest (target: ${{ matrix.target }}) ==="
          echo "node            : $(node --version)"
          echo "npm             : $(npm --version)"
          echo "rustc           : $(rustc --version)"
          echo "cargo           : $(cargo --version)"
          echo "tauri-cli       : $(npx --no-install tauri --version 2>/dev/null || echo 'from package-lock.json')"
          echo "runner          : ${{ matrix.runner }} ($(uname -m))"
          echo "sccache         : $(sccache --version) (RUSTC_WRAPPER, GHA cache backend)"
          echo "release profile : lto=${CARGO_PROFILE_RELEASE_LTO}, codegen-units=${CARGO_PROFILE_RELEASE_CODEGEN_UNITS}, debug=${CARGO_PROFILE_RELEASE_DEBUG}, split-debuginfo=${CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO}"
          echo "sentry-cli      : ${SENTRY_CLI_VERSION} (pinned; installed only when Sentry secrets present)"
          echo "xcode           : $(xcodebuild -version | tr '\n' ' ')"
          echo "actions         : checkout v7.0.0 / setup-node v6.5.0 / rust-toolchain stable / sccache-action v0.0.11 / setup-protoc v3.0.0 / rust-cache v2.9.1 / upload-artifact v7.0.1 (all SHA-pinned)"

      - name: Generate version info
        run: node scripts/generate-version.mjs

      # ── WI-4: 预构建前端 dist（可选）──
      # release/rebuild 主流程由 build-frontend job 统一构建一次前端并以
      # artifact 分发；传入名称时这里下载复用, tauri build 用 --config 把
      # beforeBuildCommand 置空跳过重复的 npm run build。留空时保持原行为。
      - name: Download prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.frontend_dist_artifact }}
          path: dist

      - name: Verify prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        run: |
          test -f dist/index.html || { echo "::error::Prebuilt frontend dist artifact '${{ inputs.frontend_dist_artifact }}' is missing index.html"; exit 1; }
          echo "✅ Prebuilt frontend dist ready ($(find dist -type f | wc -l | tr -d ' ') files)"

      # ── 导入 Developer ID 证书到独立临时 keychain ──
      # 不污染 login keychain；keychain 密码为一次性随机值；构建结束
      # (无论成败) 由 post 步骤删除。
      - name: Import Apple signing certificate
        if: ${{ !inputs.allow_unsigned }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/deepstudent-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 -d > "$CERT_PATH"
          if [ ! -s "$CERT_PATH" ]; then
            echo "::error::APPLE_CERTIFICATE_BASE64 decoded to an empty file"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$CERT_PATH"

          # 证书必须真实可用于 codesign, 且与声明的 identity 匹配
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | grep -F "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::Imported certificate does not match APPLE_SIGNING_IDENTITY ('${APPLE_SIGNING_IDENTITY}')"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "✅ Developer ID certificate imported into temporary keychain"

      - name: Prepare target-specific pdfium
        run: |
          TARGET="${{ matrix.target }}"
          if [[ -x "scripts/prepare-pdfium-macos.sh" ]]; then
            bash scripts/prepare-pdfium-macos.sh "$TARGET"
            exit 0
          fi

          echo "[warn] scripts/prepare-pdfium-macos.sh not found, falling back to legacy prepare flow."
          if [[ ! -x "scripts/download-pdfium.sh" ]]; then
            echo "[warn] scripts/download-pdfium.sh not found, skip pdfium prepare."
            exit 0
          fi

          case "$TARGET" in
            aarch64-apple-darwin)
              rm -f src-tauri/resources/pdfium/libpdfium.dylib
              bash scripts/download-pdfium.sh macos-arm64
              ;;
            x86_64-apple-darwin)
              rm -f src-tauri/resources/pdfium/libpdfium.dylib
              bash scripts/download-pdfium.sh macos-x64
              ;;
            *)
              echo "::error::Unsupported macOS target: $TARGET"
              exit 1
              ;;
          esac

      - name: Build Tauri app (codesign + notarize + staple)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SILICONFLOW_BUILTIN_TEXT_KEY: ${{ secrets.SILICONFLOW_BUILTIN_TEXT_KEY }}
          SILICONFLOW_BUILTIN_VISION_KEY: ${{ secrets.SILICONFLOW_BUILTIN_VISION_KEY }}
          SILICONFLOW_BUILTIN_EMBED_KEY: ${{ secrets.SILICONFLOW_BUILTIN_EMBED_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # macOS 代码签名 + notarytool 公证 + staple（Preflight 已保证
          # secrets 全部就绪; 证书已导入临时 keychain）
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && '1' || '0' }}
          FRONTEND_DIST_ARTIFACT: ${{ inputs.frontend_dist_artifact }}
        run: |
          if [[ "$ALLOW_UNSIGNED" == "1" ]]; then
            # Empty APPLE_* variables override tauri.conf.json and make Tauri
            # invoke codesign with identity "". Remove them so the configured
            # ad-hoc identity ("-") is used for unsigned recovery bundles.
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          CONFIG_ARGS=()
          if [[ -n "$FRONTEND_DIST_ARTIFACT" ]]; then
            # dist 已由 build-frontend artifact 提供；tauri-cli 对空字符串
            # hook 直接跳过（helpers::run_hook: Script(s) if s.is_empty()）
            CONFIG_ARGS=(--config '{"build":{"beforeBuildCommand":""}}')
          fi
          npx tauri build --target ${{ matrix.target }} "${CONFIG_ARGS[@]}" -- --locked

      # 与 ci.yml 各 Rust job 的 sccache 摘要模式对齐：if: always() 保证编译
      # 失败时也能拿到命中率，结果同时写入日志与 job summary。
      # Linux/Windows 的 reusable-build-* 同结构。
      - name: Show sccache stats
        if: always()
        run: |
          STATS="$(sccache --show-stats 2>&1 || echo 'sccache unavailable')"
          echo "$STATS"
          {
            echo "## sccache stats (release ${{ matrix.target }})"
            echo ""
            echo '```'
            echo "$STATS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 签名/公证结果强制验证（fail-closed）──
      # codesign --verify --strict + stapler validate + spctl --assess:
      # 任何一项不通过, 产物一律不允许进入 publish。
      - name: Verify codesign / notarization / staple / Gatekeeper
        if: ${{ !inputs.allow_unsigned }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"

          APP_DIR=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found under $BUNDLE_DIR/macos"
            exit 1
          fi
          echo "🔍 Verifying: $APP_DIR"

          echo "── codesign --verify --deep --strict ──"
          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          echo "── signing authority must be Developer ID (not ad-hoc) ──"
          AUTHORITY=$(codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep '^Authority=' | head -1 || true)
          echo "  $AUTHORITY"
          if ! codesign -dv --verbose=4 "$APP_DIR" 2>&1 | grep -q 'Authority=Developer ID Application'; then
            echo "::error::.app is not signed with a Developer ID Application certificate (ad-hoc or wrong identity)"
            exit 1
          fi

          echo "── stapler validate (notarization ticket must be attached) ──"
          xcrun stapler validate "$APP_DIR"

          echo "── spctl --assess (Gatekeeper) ──"
          spctl --assess --type execute --verbose=2 "$APP_DIR"

          # DMG: 必须由 Developer ID 签名（公证票随内部已 staple 的 .app）
          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg found under $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "🔍 Verifying DMG signature: $DMG"
          codesign --verify --verbose=2 "$DMG"

          echo "✅ codesign + notarization + staple + Gatekeeper checks all passed"

      # ── 更新器签名产物存在性校验（publish 前置防线）──
      - name: Verify updater artifact and signature exist
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          TAR_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app.tar.gz' ! -name '*.sig' | wc -l | tr -d ' ')
          SIG_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')
          if [ "$TAR_COUNT" -ne 1 ] || [ "$SIG_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 updater archive + 1 .sig, got ${TAR_COUNT} archive(s) / ${SIG_COUNT} sig(s)"
            ls -la "$BUNDLE_DIR" || true
            exit 1
          fi
          echo "✅ Updater archive + signature present"

      - name: Upload native symbols to Sentry
        if: ${{ env.SENTRY_UPLOAD_ENABLED == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: bash scripts/upload-sentry-symbols.sh "src-tauri/target/${{ matrix.target }}/release"

      - name: Verify bundled pdfium architecture
        run: |
          TARGET="${{ matrix.target }}"
          if [[ -x "scripts/verify-macos-pdfium-bundle.sh" ]]; then
            bash scripts/verify-macos-pdfium-bundle.sh "$TARGET"
            exit 0
          fi

          echo "[warn] scripts/verify-macos-pdfium-bundle.sh not found, falling back to legacy verify flow."
          APP_DIR=$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -type d -name '*.app' | head -n 1)
          if [[ -z "$APP_DIR" ]]; then
            echo "[warn] No .app found for $TARGET, skip verify."
            exit 0
          fi
          LIB="$APP_DIR/Contents/Resources/libpdfium.dylib"
          if [[ ! -f "$LIB" ]]; then
            echo "[warn] Bundled libpdfium.dylib missing, skip verify."
            exit 0
          fi
          ARCH_INFO=$(lipo -info "$LIB" 2>/dev/null || true)
          case "$TARGET" in
            aarch64-apple-darwin)
              [[ "$ARCH_INFO" == *"arm64"* ]] || { echo "::error::Bundled libpdfium missing arm64: $ARCH_INFO"; exit 1; }
              ;;
            x86_64-apple-darwin)
              [[ "$ARCH_INFO" == *"x86_64"* ]] || { echo "::error::Bundled libpdfium missing x86_64: $ARCH_INFO"; exit 1; }
              ;;
          esac
          echo "Verified bundled pdfium: $ARCH_INFO"

      - name: Rename updater artifacts with version and arch suffix
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          ARCH=$(echo "${{ matrix.target }}" | cut -d'-' -f1)
          VERSION=$(node -p "require('./package.json').version")
          for f in "$BUNDLE_DIR"/*.app.tar.gz; do
            [ -f "$f" ] || continue
            BASE=$(basename "$f" .app.tar.gz | tr ' ' '.')
            mv "$f" "$BUNDLE_DIR/${BASE}_${VERSION}_${ARCH}.app.tar.gz"
            [ -f "$f.sig" ] && mv "$f.sig" "$BUNDLE_DIR/${BASE}_${VERSION}_${ARCH}.app.tar.gz.sig"
          done
          echo "📦 Renamed updater artifacts:"
          ls -la "$BUNDLE_DIR"/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

      # 无论成败都清理临时 keychain, 不让证书残留在 runner 上
      - name: Cleanup signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
            echo "🧹 Temporary signing keychain removed"
          fi
