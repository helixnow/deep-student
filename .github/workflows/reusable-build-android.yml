# Android Capacitor release APK build (reusable, fail-closed on signing)
name: Build Android (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Immutable 40-char source commit SHA'
        required: false
        type: string
        default: ''
      ref:
        description: 'Source git ref (branch / tag / commit SHA)'
        required: true
        type: string
      version:
        description: 'Release version without v prefix (e.g. 0.20.0)'
        required: true
        type: string
      frontend_dist_artifact:
        description: 'Optional prebuilt frontend dist artifact name for release provenance verification'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.LINUX_BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Preflight — require Android signing secrets (fail-closed)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING=""
          for VAR in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              MISSING="${MISSING} ${VAR}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Android release build refuses to run without signing secrets:${MISSING}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || inputs.ref }}

      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts/ci

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Verify pinned release source before installing dependencies
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs source

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install root and mobile dependencies
        run: |
          npm ci --legacy-peer-deps
          npm --prefix mobile ci --legacy-peer-deps

      - name: Cache Gradle distribution
        run: |
          dest="$HOME/.gradle/wrapper/dists/gradle-8.14.3-bin/seed"
          mkdir -p "$dest"
          if ! curl -fsSL --retry 2 --retry-delay 5 -o "$dest/gradle-8.14.3-bin.zip" https://services.gradle.org/distributions/gradle-8.14.3-bin.zip; then
            curl -fsSL --retry 3 --retry-delay 5 -o "$dest/gradle-8.14.3-bin.zip" https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
          fi

      - name: Download prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.frontend_dist_artifact }}
          path: dist

      - name: Verify prebuilt frontend identity and contents
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-check --dir dist

      - name: Build and sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'deepstudent' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty keystore"
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$KEYSTORE_PATH"

          mkdir -p android-output
          OUT_APK="android-output/Deep.Student_${{ inputs.version }}_arm64.apk"
          for attempt in 1 2 3; do
            if node mobile/scripts/build-apk.mjs --release --output "$OUT_APK"; then
              test -s "$OUT_APK"
              ls -lh android-output/
              exit 0
            fi
            echo "apk build failed (attempt ${attempt}/3), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Record release asset provenance
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        env:
          RELEASE_TARGET: aarch64-linux-android
          RELEASE_ARTIFACT_DIR: android-output
        run: >-
          node .release-tooling/scripts/ci/release-contracts.mjs provenance-write
          --target "$RELEASE_TARGET" --dir "$RELEASE_ARTIFACT_DIR"
          --output "$RUNNER_TEMP/release-provenance.json"

      - name: Upload release asset provenance
        if: ${{ inputs.source_sha != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-provenance-aarch64-linux-android
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
          overwrite: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          overwrite: true
          name: android-arm64
          path: android-output/*.apk
