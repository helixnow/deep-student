# ╔══════════════════════════════════════════════════════════════════╗
# ║  手动重建 Release (rebuild-release.yml)                        ║
# ╠══════════════════════════════════════════════════════════════════╣
# ║                                                                ║
# ║  用途: 重新构建并发布某个已存在的 tag 版本                     ║
# ║  场景: 构建失败需要重试 / 需要替换已有产物 / 补发某个平台      ║
# ║                                                                ║
# ║  安全保障:                                                     ║
# ║    - 只接受已存在于仓库中的 tag (不存在则 checkout 失败)        ║
# ║    - 与主流程完全相同的版本号三重校验 (reusable)               ║
# ║    - 与主流程完全相同的迁移兼容性门禁 (fail-closed, reusable)  ║
# ║      —— 审查 F2 修复: 此前 rebuild 路径可绕过该门禁出包        ║
# ║    - 构建/发布与 release.yml 共用 reusable workflow, 不会漂移  ║
# ║      —— 审查 F1 修复: 此前 rebuild 的 Android 构建缺失         ║
# ║         Prepare Android project 步骤, 会静默产出回归 APK       ║
# ║    - checkout 的是 tag 指向的 commit, 不受 headSha 影响        ║
# ║                                                                ║
# ║  操作: GitHub → Actions → Rebuild Release → Run workflow       ║
# ║        输入 tag 名称 (如 v0.9.22) → 自动构建发布               ║
# ╚══════════════════════════════════════════════════════════════════╝

name: Rebuild Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要重建的 tag (如 v0.9.22), 必须是已存在的 tag'
        required: true
        type: string
      allow_missing_migration_fixtures:
        description: '管理员恢复发布：外部 full migration fixture 未配置时，生产迁移测试通过后继续'
        required: false
        default: false
        type: boolean
      allow_unsigned_desktop:
        description: '管理员恢复发布：缺少 Apple/Windows 平台证书时允许未公证/未 Authenticode 构建'
        required: false
        default: false
        type: boolean

concurrency:
  group: rebuild-${{ github.event.inputs.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 版本号三重校验门禁 (与 release.yml 共用)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  verify:
    uses: ./.github/workflows/reusable-verify-version.yml
    with:
      tag_name: ${{ github.event.inputs.tag_name }}

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 迁移兼容性门禁 (fail-closed, 与 release.yml 共用)
  # 重建已发布过的 tag 时本门禁理应重复通过; 代价 ~20 分钟,
  # 换来的是 rebuild 路径无法绕过 fail-closed 出包。
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  migration-compatibility-gate:
    needs: [verify]
    uses: ./.github/workflows/reusable-migration-gate.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      allow_missing_fixtures: ${{ inputs.allow_missing_migration_fixtures }}
    secrets: inherit

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 构建 (与 release.yml 共用 reusable workflow)
  # WI-4: 前端 dist 只构建一次 (build-frontend), 各平台构建 job 下载
  # frontend-dist artifact 复用; 只依赖 verify, 与迁移门禁并行。
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  build-frontend:
    needs: [verify]
    uses: ./.github/workflows/reusable-build-frontend.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
    secrets: inherit

  build-macos:
    needs: [verify, migration-compatibility-gate, build-frontend]
    uses: ./.github/workflows/reusable-build-macos.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      allow_unsigned: ${{ inputs.allow_unsigned_desktop }}
      frontend_dist_artifact: frontend-dist
    secrets: inherit

  build-windows:
    needs: [verify, migration-compatibility-gate, build-frontend]
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      allow_unsigned: ${{ inputs.allow_unsigned_desktop }}
      frontend_dist_artifact: frontend-dist
    secrets: inherit

  build-linux:
    needs: [verify, migration-compatibility-gate, build-frontend]
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      frontend_dist_artifact: frontend-dist
    secrets: inherit

  build-android:
    needs: [verify, migration-compatibility-gate, build-frontend]
    uses: ./.github/workflows/reusable-build-android.yml
    with:
      ref: ${{ needs.verify.outputs.tag_name }}
      version: ${{ needs.verify.outputs.version }}
      frontend_dist_artifact: frontend-dist
    secrets: inherit

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 发布 (与 release.yml 共用; Android 失败不阻塞桌面端发布)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  publish:
    needs: [verify, build-macos, build-windows, build-linux, build-android]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success' &&
      !cancelled()
    permissions:
      contents: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      version: ${{ needs.verify.outputs.version }}
    secrets: inherit
