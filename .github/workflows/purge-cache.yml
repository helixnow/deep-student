# 手动刷新 Cloudflare CDN 缓存（兜底工具）
#
# 正常发布/重建/热修流程已自动 purge（见 reusable-publish.yml /
# rebuild-android.yml / hotfix-linux-release.yml / upload-r2.yml）。
# 本 workflow 保留为手动兜底：secrets 缺失导致自动 purge 跳过、或
# 需要刷新任意额外 URL 时使用。

name: Purge Cloudflare Cache (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要刷新的 Release tag（如 v0.9.30）"
        required: true
      zone_id:
        description: "Cloudflare Zone ID（可选；不填则尝试自动发现）"
        required: false
      include_latest:
        description: "是否同时刷新 releases/latest.json"
        required: true
        default: "true"
      additional_urls:
        description: "额外要刷新的 URL（可选，支持逗号/空格/换行分隔）"
        required: false

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow ref 的 checkout：提供 scripts/ci/purge-cdn.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "❌ Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build purge URL list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          INCLUDE_LATEST="${{ github.event.inputs.include_latest }}"
          EXTRA_URLS="${{ github.event.inputs.additional_urls }}"
          BASE_URL="https://download.deepstudent.cn/releases/${TAG}"

          : > /tmp/purge-urls.txt

          echo "📦 Fetching release assets for tag: ${TAG}"
          ASSETS=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" -q '.assets[].name')
          if [ -z "$ASSETS" ]; then
            echo "❌ No assets found for tag ${TAG}"
            exit 1
          fi

          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue
            echo "${BASE_URL}/${NAME}" >> /tmp/purge-urls.txt
          done <<< "$ASSETS"

          if [ "$INCLUDE_LATEST" = "true" ]; then
            echo "https://download.deepstudent.cn/releases/latest.json" >> /tmp/purge-urls.txt
          fi

          if [ -n "$EXTRA_URLS" ]; then
            echo "$EXTRA_URLS" | tr ',\n\r\t' '    ' | while IFS= read -r LINE; do
              for URL in $LINE; do
                echo "$URL" >> /tmp/purge-urls.txt
              done
            done
          fi

          sort -u /tmp/purge-urls.txt -o /tmp/purge-urls.txt
          COUNT=$(wc -l < /tmp/purge-urls.txt | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No URLs to purge"
            exit 1
          fi

          echo "✅ Prepared ${COUNT} URL(s) for purge"
          head -n 20 /tmp/purge-urls.txt

      - name: Purge Cloudflare cache by URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ github.event.inputs.zone_id || secrets.CLOUDFLARE_ZONE_ID }}
        run: bash scripts/ci/purge-cdn.sh /tmp/purge-urls.txt
