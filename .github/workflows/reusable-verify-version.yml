# Release version, lockfile, license notice, and credential preflight checks (reusable)
name: Verify Release Version (reusable)

on:
  workflow_call:
    inputs:
      check_release_metadata:
        description: 'Verify lockfiles and THIRD_PARTY_NOTICES hashes'
        required: false
        type: boolean
        default: false
      check_release_secrets:
        description: 'Verify required desktop release signing and R2 secrets before expensive builds'
        required: false
        type: boolean
        default: false
      allow_unsigned_desktop:
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Target release tag (e.g. v0.20.0)'
        required: true
        type: string
    outputs:
      source_sha:
        description: 'Immutable 40-char commit SHA resolved for the tag'
        value: ${{ jobs.verify.outputs.source_sha }}
      tag_name:
        description: 'Release tag'
        value: ${{ jobs.verify.outputs.tag_name }}
      version:
        description: 'Semver without v prefix'
        value: ${{ jobs.verify.outputs.version }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tag_name: ${{ steps.verify.outputs.tag_name }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Preflight required release credentials
        if: ${{ inputs.check_release_secrets }}
        env:
          ALLOW_UNSIGNED_DESKTOP: ${{ inputs.allow_unsigned_desktop }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/release-contracts.mjs secrets

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag_name }}
          path: release-src

      - name: Resolve immutable release source
        id: source
        run: |
          SHA=$(git -C release-src rev-parse HEAD)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid source SHA'; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release source SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete release metadata
        if: ${{ inputs.check_release_metadata }}
        env:
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/ci/release-contracts.mjs source --root release-src

      - name: Check time-sensitive release requirements before any compilation
        if: ${{ inputs.check_release_metadata }}
        run: node scripts/migration-ci/verify-release-requirements.mjs --manifest scripts/migration-ci/release-requirements.json --out "$RUNNER_TEMP/release-requirements-preflight.json"

      - name: Verify version consistency
        id: verify
        run: |
          TAG="${{ inputs.tag_name }}"
          (cd release-src && bash "$GITHUB_WORKSPACE/scripts/ci/verify-version-consistency.sh" "$TAG")
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
