# 版本号三重校验（reusable）
#
# 校验 tag 版本号与 tag 指向代码里三处版本声明一致
# （package.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json）。
# release.yml / rebuild-release.yml / hotfix-linux-release.yml 共用，
# 消除此前三份逐行复制的校验实现。
#
# 脚本取自 workflow ref（默认分支），release 代码树单独 checkout 到
# release-src/ —— 这样重建早于本脚本落地的旧 tag 也能正常校验。

name: Verify Release Version (reusable)

on:
  workflow_call:
    inputs:
      check_release_metadata:
        description: '校验锁文件根版本与许可证清单；主发布和完整重建必须启用'
        required: false
        type: boolean
        default: false
      check_release_secrets:
        description: '在耗时构建前检查桌面发布所需凭据；Android 仍是可选发布目标'
        required: false
        type: boolean
        default: false
      allow_unsigned_desktop:
        required: false
        type: boolean
        default: false
      tag_name:
        description: '要校验的 tag（如 v0.9.42）'
        required: true
        type: string
    outputs:
      source_sha:
        description: 'tag 在本轮解析得到的完整不可变 commit SHA'
        value: ${{ jobs.verify.outputs.source_sha }}
      tag_name:
        description: '透传 tag'
        value: ${{ jobs.verify.outputs.tag_name }}
      version:
        description: '去掉 v 前缀的版本号'
        value: ${{ jobs.verify.outputs.version }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tag_name: ${{ steps.verify.outputs.tag_name }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      # 工作流自身 ref 的 checkout：提供 scripts/ci/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # release 代码树：可能是不含 scripts/ci 的旧 tag
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Preflight required release credentials
        if: ${{ inputs.check_release_secrets }}
        env:
          ALLOW_UNSIGNED_DESKTOP: ${{ inputs.allow_unsigned_desktop }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/release-contracts.mjs secrets

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          path: release-src

      - name: Resolve immutable release source
        id: source
        run: |
          SHA=$(git -C release-src rev-parse HEAD)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid source SHA'; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release source SHA: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete release metadata
        if: ${{ inputs.check_release_metadata }}
        env:
          RELEASE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: node scripts/ci/release-contracts.mjs source --root release-src

      - name: Check time-sensitive release requirements before any compilation
        if: ${{ inputs.check_release_metadata }}
        run: node scripts/migration-ci/verify-release-requirements.mjs --manifest scripts/migration-ci/release-requirements.json --out "$RUNNER_TEMP/release-requirements-preflight.json"

      - name: Verify version consistency
        id: verify
        run: |
          echo "=== Verify tool manifest ==="
          echo "jq        : $(jq --version)"
          echo "actions   : checkout v7.0.0 (SHA-pinned)"

          TAG="${{ inputs.tag_name }}"
          (cd release-src && bash "$GITHUB_WORKSPACE/scripts/ci/verify-version-consistency.sh" "$TAG")
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
