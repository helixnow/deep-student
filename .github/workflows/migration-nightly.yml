name: Migration Nightly
on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'resources/app/migrations/**'
      - 'host/platform/storage/migration/**'
      - 'host/platform/storage/tests/migration*'
      - 'host/plugins/backup/tests/migration-behavior.test.ts'
      - 'host/e2e/data-compat/**'
      - 'tests/fixtures/migration-upgrade/**'
      - 'tests/fixtures/migrations/**'
      - 'scripts/check-migrations.mjs'
      - 'scripts/migration-ci/**'
      - '.github/workflows/migration-nightly.yml'
permissions:
  contents: read
concurrency:
  group: migration-nightly-${{ github.ref }}
  cancel-in-progress: false
env:
  DEEP_STUDENT_BUILD_NUMBER: '14639'
jobs:
  fixtures:
    name: Migration fixtures (Host tests, upgrade + fault + scale)
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    outputs:
      full: ${{ steps.full.outputs.fixtures_available }}
      scale: ${{ steps.scale.outputs.fixtures_available }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node scripts/check-migrations.mjs
      - name: Fetch full fixture tier
        id: full
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: bash scripts/migration-ci/fetch-fixtures.sh --tier full --dest "$RUNNER_TEMP/full" --mode skip
      - name: Fetch scale fixture tier
        id: scale
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: bash scripts/migration-ci/fetch-fixtures.sh --tier scale --dest "$RUNNER_TEMP/scale" --mode skip
      - name: Host migration tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/migration-reports"
          npx vitest run -c vitest.host.config.ts \
            host/platform/storage/tests/migration-compat.test.ts \
            host/platform/storage/tests/migration-integration.test.ts \
            host/plugins/backup/tests/migration-behavior.test.ts \
            host/e2e/data-compat/migrations.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/migration-reports/host-migration-tests.json"
          # A filter that silently matches a handful of tests must not count as coverage.
          node -e 'const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!(r.numPassedTests >= 50)) { console.error("only " + r.numPassedTests + " migration tests passed"); process.exit(1); } fs.writeFileSync(process.argv[2], JSON.stringify({ migration_test_count: r.numPassedTests }));' \
            "$RUNNER_TEMP/migration-reports/host-migration-tests.json" "$RUNNER_TEMP/migration-test-count.json"
      - name: Upgrade and fault modes
        if: steps.full.outputs.fixtures_available == 'true'
        env:
          MIGRATION_FIXTURE_ROOT: ${{ steps.full.outputs.fixture_root }}
        run: |
          set -euo pipefail
          for mode in upgrade fault; do
            MIGRATION_GATE_MODE="$mode" npx vitest run -c vitest.host.config.ts \
              host/platform/storage/tests/migration-integration.test.ts -t 'MIGRATION_FIXTURE_ROOT'
          done
          node scripts/migration-ci/generate-report.mjs \
            --out "$RUNNER_TEMP/migration-reports/migration-compatibility-report.json" \
            --candidate-commit "$GITHUB_SHA" --platform linux-x86_64 --fixture-tier full \
            --fixture-hash "${{ steps.full.outputs.fixture_hash }}" \
            --test-count-file "$RUNNER_TEMP/migration-test-count.json" --fail-on-empty
      - name: Scale mode
        if: steps.scale.outputs.fixtures_available == 'true'
        env:
          MIGRATION_FIXTURE_ROOT: ${{ steps.scale.outputs.fixture_root }}
          MIGRATION_GATE_MODE: scale
          MIGRATION_GATE_MAX_SECONDS: '600'
        run: npx vitest run -c vitest.host.config.ts host/platform/storage/tests/migration-integration.test.ts -t 'MIGRATION_FIXTURE_ROOT'
      - name: Report fixture coverage
        if: always()
        run: |
          echo 'Full fixtures: ${{ steps.full.outputs.fixtures_available }}; scale fixtures: ${{ steps.scale.outputs.fixtures_available }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: migration-nightly-reports
          path: ${{ runner.temp }}/migration-reports/
          retention-days: 30

  notify:
    name: Report nightly outcome
    needs: fixtures
    if: always() && !cancelled()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.fixtures.result }}
          FULL: ${{ needs.fixtures.outputs.full }}
          SCALE: ${{ needs.fixtures.outputs.scale }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL=migration-nightly-failure
          NUMBER=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ "$RESULT" = failure ]; then
            BODY="Migration nightly failed: $RUN_URL (full=$FULL, scale=$SCALE)"
            if [ -n "$NUMBER" ]; then
              gh issue comment "$NUMBER" --body "$BODY"
            else
              gh label create "$LABEL" --color D93F0B --force
              gh issue create --title 'Migration nightly failed' --label "$LABEL" --body "$BODY"
            fi
          elif [ "$RESULT" = success ] && [ "$FULL" = true ] && [ "$SCALE" = true ] && [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --reason completed --comment "All fixture tiers recovered: $RUN_URL"
          fi
