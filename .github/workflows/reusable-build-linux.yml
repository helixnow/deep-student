# Linux 构建（reusable）
#
# release.yml / rebuild-release.yml / hotfix-linux-release.yml 共用的
# 唯一 Linux 构建实现。调用方需 `secrets: inherit`。
#
# fail-closed：updater 签名密钥及密码缺失时立即
# 失败 —— 否则会静默产出没有 .sig 的 AppImage, 到 publish 阶段才炸。
# Tauri v2 的 createUpdaterArtifacts=true 使用 AppImage 本体作为 updater
# 产物；v1Compatible 才会生成 AppImage.tar.gz。这里兼容两种格式。

name: Build Linux (reusable)

on:
  workflow_call:
    inputs:
      tag_name:
        description: '构建的 tag（如 v0.9.42）'
        required: true
        type: string
      artifact_name:
        description: '上传的 artifact 名称'
        required: false
        type: string
        default: linux-x86_64
      frontend_dist_artifact:
        description: 'WI-4: 预构建前端 dist 的 artifact 名称；留空则由 beforeBuildCommand 在本 job 内构建前端（hotfix-linux-release.yml 走此回退路径）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # 固定工具版本（升级需显式改这里）
  SENTRY_CLI_VERSION: '2.58.6'

jobs:
  build:
    # Ubuntu 24.04 hosted runners repeatedly received service shutdown signals
    # during long Rust release builds. Use the mature image for release recovery.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      SENTRY_UPLOAD_ENABLED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && 'true' || 'false' }}
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_DEBUG: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && '1' || '0' }}
      # sccache（GHA cache 后端）与 rust-cache 叠加：rust-cache 负责 registry/
      # git 依赖与 target 目录整体缓存，sccache 按编译单元缓存 rustc 输出，
      # 依赖版本或 profile 变化导致 rust-cache miss 时仍可大量命中。
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      # ── updater 签名密钥预检（fail-closed, 在任何耗时步骤之前）──
      - name: Preflight — require updater signing key (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          MISSING=""
          for VAR in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              MISSING="${MISSING} ${VAR}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Linux release build refuses to run without updater signing secrets (fail-closed)."
            echo "::error::Missing secrets:${MISSING}"
            echo "::error::Without them the AppImage updater archive would have no valid .sig and the release would be rejected at publish."
            exit 1
          fi
          echo "✅ Updater signing secrets present"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # ImageOS/ImageVersion 由 runner 镜像注入、不在 ${{ env }} 表达式上下文里
      # （直接写 ${{ env.ImageOS }} 会静默展开为空），必须经 GITHUB_ENV 中转。
      # 完整动机见 ci.yml backend job 同名步骤注释。
      - name: Resolve runner image scope for apt cache
        run: echo "APT_CACHE_SCOPE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # 文件快照级 apt 缓存（R1 在 ci.yml、R2 在 migration nightly/gate 验证过
      # 的同一模式）。包列表与 ci.yml 不同（release 打包额外需要 libgtk-3-dev /
      # libayatana-appindicator3-dev / rpm），且本 job 跑在 ubuntu-22.04 ——
      # 缓存 key = 包列表 + 镜像标识，因此拥有独立缓存条目，不会与 ci.yml
      # 的 ubuntu-latest 快照互相污染。fail-closed：缓存未命中时 action 内部
      # 执行真实 apt-get 安装，恢复/安装任一环节失败都会让本 step 失败，
      # 不存在"包没装上但构建继续"的路径。
      - name: Install Linux dependencies (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
          version: ${{ env.APT_CACHE_SCOPE }}
          execute_install_scripts: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      # 必须先于任何 cargo 调用：RUSTC_WRAPPER 是 job 级 env，
      # sccache 二进制不存在时 cargo 会直接报错。
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Setup protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'
          shared-key: release-linux-x86_64
          cache-on-failure: true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Refresh release lock metadata and third-party notices
        run: |
          (cd src-tauri && cargo metadata --format-version 1 > /dev/null)
          npm run licenses:generate

      - name: Install Sentry CLI (pinned)
        if: ${{ env.SENTRY_UPLOAD_ENABLED == 'true' }}
        run: npm install --global "@sentry/cli@${SENTRY_CLI_VERSION}"

      - name: Print build tool manifest
        run: |
          echo "=== Linux build tool manifest ==="
          echo "node            : $(node --version)"
          echo "npm             : $(npm --version)"
          echo "rustc           : $(rustc --version)"
          echo "cargo           : $(cargo --version)"
          echo "tauri-cli       : $(npx --no-install tauri --version 2>/dev/null || echo 'from package-lock.json')"
          echo "sccache         : $(sccache --version) (RUSTC_WRAPPER, GHA cache backend)"
          echo "release profile : lto=${CARGO_PROFILE_RELEASE_LTO}, codegen-units=${CARGO_PROFILE_RELEASE_CODEGEN_UNITS}, debug=${CARGO_PROFILE_RELEASE_DEBUG}"
          echo "sentry-cli      : ${SENTRY_CLI_VERSION} (pinned; installed only when Sentry secrets present)"
          echo "actions         : checkout v7.0.0 / setup-node v6.5.0 / rust-toolchain stable / sccache-action v0.0.11 / setup-protoc v3.0.0 / rust-cache v2.9.1 / cache-apt-pkgs v1.6.3 / upload-artifact v7.0.1 (all SHA-pinned)"

      - name: Generate version info
        run: node scripts/generate-version.mjs

      # ── WI-4: 预构建前端 dist（可选）──
      # release/rebuild 主流程由 build-frontend job 统一构建一次前端并以
      # artifact 分发；传入名称时这里下载复用, tauri build 用 --config 把
      # beforeBuildCommand 置空跳过重复的 npm run build（其 Sentry 前端
      # sourcemap 上传也已随之收敛到 build-frontend）。留空时保持原行为。
      - name: Download prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.frontend_dist_artifact }}
          path: dist

      - name: Verify prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        run: |
          test -f dist/index.html || { echo "::error::Prebuilt frontend dist artifact '${{ inputs.frontend_dist_artifact }}' is missing index.html"; exit 1; }
          echo "✅ Prebuilt frontend dist ready ($(find dist -type f | wc -l | tr -d ' ') files)"

      # 2026-08-06: Linux 此前完全没有打包 libpdfium.so，PDF 预览/文本提取/OCR
      # 在 Linux 上一直不可用（老问题，随本次 OCR/pdfium 修复一并补齐）。
      # 与 macOS/Windows 一致：构建前下载 x64 pdfium 放入 resources。
      - name: Prepare target-specific pdfium
        run: |
          if [ -f "src-tauri/resources/pdfium/libpdfium.so" ]; then
            echo "Using existing pdfium: $(du -h --apparent-size src-tauri/resources/pdfium/libpdfium.so | cut -f1)"
          else
            bash scripts/download-pdfium.sh linux-x64
          fi
          test -f "src-tauri/resources/pdfium/libpdfium.so" || { echo "::error::libpdfium.so missing after prepare"; exit 1; }

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SILICONFLOW_BUILTIN_TEXT_KEY: ${{ secrets.SILICONFLOW_BUILTIN_TEXT_KEY }}
          SILICONFLOW_BUILTIN_VISION_KEY: ${{ secrets.SILICONFLOW_BUILTIN_VISION_KEY }}
          SILICONFLOW_BUILTIN_EMBED_KEY: ${{ secrets.SILICONFLOW_BUILTIN_EMBED_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # 仅回退路径（frontend_dist_artifact 为空, beforeBuildCommand 在本
          # job 内跑 vite build）时生效；预构建 dist 路径下 vite 不运行,
          # sourcemap 上传由 reusable-build-frontend.yml 完成。
          SENTRY_UPLOAD_SOURCEMAPS: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && '1' || '0' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          FRONTEND_DIST_ARTIFACT: ${{ inputs.frontend_dist_artifact }}
        run: |
          CONFIG_ARGS=()
          if [ -n "$FRONTEND_DIST_ARTIFACT" ]; then
            # dist 已由 build-frontend artifact 提供；tauri-cli 对空字符串
            # hook 直接跳过（helpers::run_hook: Script(s) if s.is_empty()）
            CONFIG_ARGS=(--config '{"build":{"beforeBuildCommand":""}}')
          fi
          npx tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage "${CONFIG_ARGS[@]}" -- --locked

      # 与 ci.yml 各 Rust job 的 sccache 摘要模式对齐：if: always() 保证编译
      # 失败时也能拿到命中率（恰是最需要缓存诊断的场景），结果同时写入
      # 日志与 job summary。macOS/Windows 的 reusable-build-* 同结构。
      - name: Show sccache stats
        if: always()
        run: |
          STATS="$(sccache --show-stats 2>&1 || echo 'sccache unavailable')"
          echo "$STATS"
          {
            echo "## sccache stats (release linux-x86_64)"
            echo ""
            echo '```'
            echo "$STATS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native symbols to Sentry
        if: ${{ env.SENTRY_UPLOAD_ENABLED == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: bash scripts/upload-sentry-symbols.sh "src-tauri/target/x86_64-unknown-linux-gnu/release"

      - name: Rename updater artifacts with arch suffix
        run: |
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"

          # Tauri v2: AppImage 本体就是 updater 产物，签名文件为
          # <app>.AppImage.sig。文件名可改，签名仍对应文件内容。
          for f in "$BUNDLE_DIR"/*.AppImage; do
            [ -f "$f" ] || continue
            BASE=$(basename "$f" .AppImage | tr ' ' '.')
            TARGET="$BUNDLE_DIR/${BASE}_x86_64.AppImage"
            if [ "$f" != "$TARGET" ]; then
              mv "$f" "$TARGET"
              [ -f "$f.sig" ] && mv "$f.sig" "$TARGET.sig"
            fi
          done

          # Tauri v1Compatible: updater archive + signature.
          for f in "$BUNDLE_DIR"/*.AppImage.tar.gz; do
            [ -f "$f" ] || continue
            BASE=$(basename "$f" .AppImage.tar.gz | tr ' ' '.')
            mv "$f" "$BUNDLE_DIR/${BASE}_x86_64.AppImage.tar.gz"
            [ -f "$f.sig" ] && mv "$f.sig" "$BUNDLE_DIR/${BASE}_x86_64.AppImage.tar.gz.sig"
          done
          echo "📦 Linux bundle artifacts:"
          ls -la src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/

      # ── 更新器签名产物存在性校验（publish 前置防线）──
      - name: Verify updater artifact and signature exist
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
          V2_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*_x86_64.AppImage' ! -name '*.sig' | wc -l | tr -d ' ')
          V2_SIG_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*_x86_64.AppImage.sig' | wc -l | tr -d ' ')
          V1_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*_x86_64.AppImage.tar.gz' ! -name '*.sig' | wc -l | tr -d ' ')
          V1_SIG_COUNT=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*_x86_64.AppImage.tar.gz.sig' | wc -l | tr -d ' ')
          V2_OK=$([ "$V2_COUNT" -eq 1 ] && [ "$V2_SIG_COUNT" -eq 1 ] && echo 1 || echo 0)
          V1_OK=$([ "$V1_COUNT" -eq 1 ] && [ "$V1_SIG_COUNT" -eq 1 ] && echo 1 || echo 0)
          if [ "$V2_OK" -ne 1 ] && [ "$V1_OK" -ne 1 ]; then
            echo "::error::Expected Tauri v2 AppImage + .sig or v1Compatible tarball + .sig; got v2 ${V2_COUNT}/${V2_SIG_COUNT}, v1 ${V1_COUNT}/${V1_SIG_COUNT}"
            ls -la "$BUNDLE_DIR" || true
            exit 1
          fi
          echo "✅ Updater artifact + signature present"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
