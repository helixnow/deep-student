# Linux Electron release build (x64 AppImage + deb + minisign)
name: Build Linux (reusable)

on:
  workflow_call:
    inputs:
      force_rebuild:
        default: false
        type: boolean
      source_sha:
        description: 'Immutable 40-char source commit SHA'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Release tag (e.g. v0.20.0)'
        required: true
        type: string
      frontend_dist_artifact:
        description: 'Prebuilt frontend dist artifact name; builds locally when empty'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ${{ vars.LINUX_BUILD_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 90
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RELEASE_FORCE_REBUILD: ${{ inputs.force_rebuild }}
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: '--max-old-space-size=4096'
      ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
      ELECTRON_CUSTOM_DIR: '{{ version }}'
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
    steps:
      - name: Preflight — require updater signing secrets (fail-closed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Linux release build missing TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || inputs.tag_name }}

      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/ci
            .github/actions

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Verify pinned release source before installing dependencies
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs source

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfuse2

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Install Electron binary
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "electron download failed (attempt ${attempt}/3), retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Download prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.frontend_dist_artifact }}
          path: dist

      - name: Verify prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        run: |
          test -f dist/index.html || { echo "::error::Prebuilt frontend dist missing index.html"; exit 1; }
          echo "Prebuilt frontend dist ready ($(find dist -type f | wc -l | tr -d ' ') files)"

      - name: Verify prebuilt frontend identity and contents
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-check --dir dist

      - name: Build frontend locally (fallback)
        if: ${{ inputs.frontend_dist_artifact == '' }}
        run: npm run build

      - name: Package Linux Electron app
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          for attempt in 1 2 3; do
            if node electron/scripts/package.mjs --linux --x64; then exit 0; fi
            echo "packaging failed (attempt ${attempt}/3), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Verify fuses and asar integrity
        run: node electron/scripts/verify-fuses.mjs --linux

      - name: Sign updater AppImage with minisign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APPIMAGE=$(find release -maxdepth 1 -name '*_x86_64.AppImage' ! -name '*.sig' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No *_x86_64.AppImage found under release/"
            ls -la release/ || true
            exit 1
          fi
          node .release-tooling/scripts/ci/sign-updater.mjs "$APPIMAGE"
          test -s "${APPIMAGE}.sig"

      - name: Verify updater AppImage, signature, and deb exist
        run: |
          set -euo pipefail
          APPIMAGE_COUNT=$(find release -maxdepth 1 -name '*.AppImage' ! -name '*.sig' | wc -l | tr -d ' ')
          SIG_COUNT=$(find release -maxdepth 1 -name '*.AppImage.sig' | wc -l | tr -d ' ')
          DEB_COUNT=$(find release -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')
          if [ "$APPIMAGE_COUNT" -ne 1 ] || [ "$SIG_COUNT" -ne 1 ] || [ "$DEB_COUNT" -ne 1 ]; then
            echo "::error::Expected 1 .AppImage, 1 .sig, 1 .deb; got ${APPIMAGE_COUNT}/${SIG_COUNT}/${DEB_COUNT}"
            ls -la release/ || true
            exit 1
          fi

      - name: Stage Linux release deliverables
        run: |
          mkdir -p linux-output
          cp release/*.AppImage linux-output/
          cp release/*.AppImage.sig linux-output/
          cp release/*.deb linux-output/

      - name: Record locally built frontend identity
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact == '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-write --dir dist

      - name: Record release asset provenance
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        env:
          RELEASE_TARGET: x86_64-unknown-linux-gnu
          RELEASE_ARTIFACT_DIR: linux-output
        run: >-
          node .release-tooling/scripts/ci/release-contracts.mjs provenance-write
          --target "$RELEASE_TARGET" --dir "$RELEASE_ARTIFACT_DIR"
          --output "$RUNNER_TEMP/release-provenance.json"

      - name: Upload release asset provenance
        if: ${{ inputs.source_sha != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-provenance-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
          overwrite: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          overwrite: true
          name: linux-x86_64
          retention-days: 30
          compression-level: 0
          path: linux-output/*

      - uses: ./.release-tooling/.github/actions/release-checkpoint
        if: inputs.source_sha != ''
        with:
          stage: linux
