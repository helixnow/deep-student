name: Sync Release to R2 (Manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.20.0)'
        required: true

permissions:
  contents: read

env:
  R2_BUCKET: deepstudent
  KEEP_VERSIONS: 10

jobs:
  upload-to-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve tag
        id: tag
        run: |
          echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Download Release Assets
        uses: robinraju/release-downloader@c39a3b234af58f0cf85888573d361fb6fa281534
        with:
          repository: ${{ github.repository }}
          tag: ${{ steps.tag.outputs.value }}
          fileName: "*"
          out-file-path: "release-assets"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Upload to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          FAILED_FILES=""
          for FILE in release-assets/*; do
            NAME=$(basename "$FILE")
            case "$NAME" in
              *.json) CT="application/json" ;;
              *.sig)  CT="application/pgp-signature" ;;
              *.dmg)  CT="application/x-apple-diskimage" ;;
              *.apk)  CT="application/vnd.android.package-archive" ;;
              *.deb)  CT="application/vnd.debian.binary-package" ;;
              *)      CT="application/octet-stream" ;;
            esac
            if ! bash scripts/ci/r2-put.sh \
              "${R2_BUCKET}/releases/${TAG}/${NAME}" \
              "$FILE" \
              "$CT" \
              "public, max-age=31536000, immutable"; then
              FAILED_FILES="${FAILED_FILES}${NAME}\n"
            fi
          done
          if [ -n "$FAILED_FILES" ]; then
            printf "%b" "$FAILED_FILES"
            exit 1
          fi

      - name: Generate R2 latest.json for auto-updater
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          R2_BASE="https://download.deepstudent.cn/releases/${TAG}"
          if [ ! -f release-assets/latest.json ]; then
            exit 0
          fi
          APK_NAME=$(find release-assets -maxdepth 1 -name '*.apk' -printf '%f\n' | sort | head -1)
          APK_URL=""
          if [ -n "$APK_NAME" ]; then
            APK_URL="${R2_BASE}/${APK_NAME}"
          fi
          jq --arg base "$R2_BASE" --arg apk "$APK_URL" '
            .platforms |= with_entries(
              .value.url = ($base + "/" + (.value.url | split("/") | last))
            )
            | if $apk != "" then
                .apk_url = $apk
                | .android = ((.android // {}) + {status: "available", url: $apk})
              else .
              end
          ' release-assets/latest.json > r2-latest.json
          CHANNEL=$(jq -r '.channel // "stable"' r2-latest.json)
          if [ "$CHANNEL" = "experimental" ]; then
            bash scripts/ci/r2-put.sh \
              "${R2_BUCKET}/releases/experimental/latest.json" \
              "r2-latest.json" \
              "application/json" \
              "public, max-age=300"
          fi
          bash scripts/ci/r2-put.sh \
            "${R2_BUCKET}/releases/latest.json" \
            "r2-latest.json" \
            "application/json" \
            "public, max-age=300"

      - name: Purge Cloudflare CDN cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          BASE_URL="https://download.deepstudent.cn/releases/${TAG}"
          {
            for FILE in release-assets/*; do
              echo "${BASE_URL}/$(basename "$FILE")"
            done
            echo "https://download.deepstudent.cn/releases/latest.json"
            echo "https://download.deepstudent.cn/releases/experimental/latest.json"
          } > /tmp/purge-urls.txt
          bash scripts/ci/purge-cdn.sh /tmp/purge-urls.txt

      - name: Cleanup old versions
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/ci/r2-cleanup-old-versions.sh
