# Database migration compatibility gate (reusable, fail-closed)
name: Migration Compatibility Gate (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Immutable 40-char source commit SHA'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Release tag (e.g. v0.20.0)'
        required: true
        type: string
      allow_missing_fixtures:
        description: 'Manual recovery override: run production host migration tests without external full fixtures'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ${{ vars.LINUX_BUILD_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 60
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || inputs.tag_name }}
          fetch-depth: 0

      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/ci
            scripts/migration-ci
            .github/actions

      - name: Overlay release requirements from workflow revision
        run: |
          REQUIREMENTS="scripts/migration-ci/release-requirements.json"
          if [ -f ".release-tooling/${REQUIREMENTS}" ]; then
            cp ".release-tooling/${REQUIREMENTS}" "${REQUIREMENTS}"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Verify pinned release source before installing dependencies
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs source

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Static migration gate
        run: node scripts/check-migrations.mjs

      - name: Fetch full fixture tier (fail-closed)
        if: ${{ !inputs.allow_missing_fixtures }}
        id: fixtures
        env:
          MIGRATION_FIXTURE_URL: ${{ secrets.MIGRATION_FIXTURE_URL }}
          MIGRATION_FIXTURE_SHA256: ${{ secrets.MIGRATION_FIXTURE_SHA256 }}
          MIGRATION_FIXTURE_TOKEN: ${{ secrets.MIGRATION_FIXTURE_TOKEN }}
        run: |
          bash scripts/migration-ci/fetch-fixtures.sh \
            --tier full --dest "$RUNNER_TEMP/migration-fixtures" --mode require

      - name: Record manual fixture override
        if: ${{ inputs.allow_missing_fixtures }}
        run: |
          echo "::warning::Explicit fixture override selected; host migration tests remain required."

      - name: Production host migration tests (non-zero count enforced)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/migration-reports"
          npx vitest run -c vitest.host.config.ts \
            host/platform/storage/tests/migration-compat.test.ts \
            host/platform/storage/tests/migration-integration.test.ts \
            host/plugins/backup/tests/migration-behavior.test.ts \
            host/e2e/data-compat/migrations.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/migration-reports/host-migration-tests.json"
          node -e 'const fs = require("fs"); const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!(r.numPassedTests >= 50)) { console.error("only " + r.numPassedTests + " migration tests passed"); process.exit(1); } fs.writeFileSync(process.argv[2], JSON.stringify({ passed: r.numPassedTests, migration_test_count: r.numPassedTests }));' \
            "$RUNNER_TEMP/migration-reports/host-migration-tests.json" "$RUNNER_TEMP/migration-test-count.json"

      - name: Upgrade and fault-injection fixture tests
        if: ${{ !inputs.allow_missing_fixtures }}
        env:
          MIGRATION_FIXTURE_ROOT: ${{ steps.fixtures.outputs.fixture_root }}
        run: |
          set -euo pipefail
          for mode in upgrade fault; do
            MIGRATION_GATE_MODE="$mode" npx vitest run -c vitest.host.config.ts \
              host/platform/storage/tests/migration-integration.test.ts -t 'MIGRATION_FIXTURE_ROOT'
          done

      - name: Verify release requirements (artifact upgrade E2E manifest)
        run: |
          node scripts/migration-ci/verify-release-requirements.mjs \
            --manifest scripts/migration-ci/release-requirements.json \
            --out "$RUNNER_TEMP/migration-reports/release-requirements-result.json"

      - name: Generate migration compatibility report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/migration-reports"
          ARGS=(
            --out "$RUNNER_TEMP/migration-reports/migration-compatibility-report.json"
            --candidate-commit "$(git rev-parse HEAD)"
            --tag "${{ inputs.tag_name }}"
            --platform "linux-x86_64"
            --fixture-tier "${{ inputs.allow_missing_fixtures && 'manual-override-production-tests-only' || 'full' }}"
            --fixture-hash "${{ steps.fixtures.outputs.fixture_hash || 'none' }}"
            --fail-on-empty
          )
          [ -f "$RUNNER_TEMP/migration-test-count.json" ] && \
            ARGS+=(--test-count-file "$RUNNER_TEMP/migration-test-count.json")
          [ -f "$RUNNER_TEMP/migration-reports/release-requirements-result.json" ] && \
            ARGS+=(--requirements-result "$RUNNER_TEMP/migration-reports/release-requirements-result.json")
          node scripts/migration-ci/generate-report.mjs "${ARGS[@]}"

      - name: Upload migration compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: migration-compatibility-report
          path: ${{ runner.temp }}/migration-reports/
          retention-days: 90
          if-no-files-found: warn
          overwrite: true

      - uses: ./.release-tooling/.github/actions/release-checkpoint
        if: success() && inputs.source_sha != ''
        with:
          stage: migration
          policy: ${{ inputs.allow_missing_fixtures }}
