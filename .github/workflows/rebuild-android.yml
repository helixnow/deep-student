name: Rebuild Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target release tag (e.g. v0.20.0)'
        required: true
        type: string
      source_ref:
        description: 'Source ref (branch/tag/commit SHA); defaults to tag itself'
        required: false
        default: ''
        type: string
      allow_version_mismatch:
        description: 'Allow source_ref version to differ from tag'
        required: false
        default: false
        type: boolean

concurrency:
  group: rebuild-android-${{ github.event.inputs.tag_name }}-${{ github.workflow_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: deepstudent

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag_name: ${{ steps.info.outputs.tag_name }}
      source_ref: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate inputs and fetch release info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: '${TAG}'. Expected: v0.20.0"
            exit 1
          fi

          RELEASE_ID=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release '${TAG}' not found"
            exit 1
          fi

          SOURCE_REF="${{ github.event.inputs.source_ref }}"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="$TAG"
          fi

          VERSION="${TAG#v}"
          {
            echo "tag_name=${TAG}"
            echo "version=${VERSION}"
            echo "source_ref=${SOURCE_REF}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.info.outputs.source_ref }}

      - name: Freeze source ref for the build job
        id: source
        run: |
          SHA=$(git rev-parse HEAD)
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify source_ref version matches tag
        run: |
          TAG_VERSION="${{ steps.info.outputs.version }}"
          SRC_VERSION=$(jq -r '.version' package.json)
          if [[ "$SRC_VERSION" != "$TAG_VERSION" ]]; then
            if [[ "${{ github.event.inputs.allow_version_mismatch }}" == "true" ]]; then
              echo "::warning::source_ref version (${SRC_VERSION}) != tag (${TAG_VERSION}) — proceeding because allow_version_mismatch=true"
            else
              echo "::error::source_ref version (${SRC_VERSION}) does not match tag (${TAG_VERSION})."
              exit 1
            fi
          fi

  build-android:
    needs: [preflight]
    uses: ./.github/workflows/reusable-build-android.yml
    with:
      ref: ${{ needs.preflight.outputs.source_ref }}
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  publish:
    concurrency:
      group: release-assets-${{ github.repository }}
      cancel-in-progress: false
    needs: [preflight, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: android-arm64
          path: android-output

      - name: Guard — verify signed APK structure
        run: |
          APK_FILE=$(find android-output -maxdepth 1 -name '*.apk' -type f | sort | head -1)
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::No non-empty APK artifact found for publish"
            exit 1
          fi
          unzip -l "$APK_FILE" | grep -q 'classes\.dex' || { echo "::error::Invalid APK archive (missing classes.dex)"; exit 1; }

      - name: Delete old APK from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          ASSET_IDS=$(gh api "repos/${GH_REPO}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | endswith(".apk")) | .id' 2>/dev/null || echo "")
          if [ -n "$ASSET_IDS" ]; then
            echo "$ASSET_IDS" | while read -r AID; do
              gh api -X DELETE "repos/${GH_REPO}/releases/assets/${AID}"
            done
          fi

      - name: Upload new APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          APK_FILE=$(find android-output -maxdepth 1 -name '*.apk' -type f | sort | head -1)
          gh release upload "${TAG}" "$APK_FILE" --repo "${GH_REPO}" --clobber

      - name: Setup Node.js for wrangler
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Mark the GitHub release manifest Android asset available
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          COUNT=$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" --jq '[.assets[] | select(.name == "latest.json")] | length')
          if [ "$COUNT" = 0 ]; then
            exit 0
          fi
          DIR="$RUNNER_TEMP/android-release-manifest"
          mkdir -p "$DIR"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern latest.json --dir "$DIR" --clobber
          APK_FILE=$(find android-output -maxdepth 1 -name '*.apk' -type f | sort | head -1)
          test -n "$APK_FILE"
          APK_URL="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/$(basename "$APK_FILE")"
          node scripts/ci/release-contracts.mjs android-manifest --file "$DIR/latest.json" --output "$DIR/patched/latest.json" --version "$RELEASE_VERSION" --url "$APK_URL"
          gh release upload "$RELEASE_TAG" "$DIR/patched/latest.json" --repo "$GH_REPO" --clobber

      - name: Upload APK to R2 & update latest.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          R2_BASE="https://download.deepstudent.cn/releases/${TAG}"
          APK_FILE=$(find android-output -maxdepth 1 -name '*.apk' -type f | sort | head -1)
          APK_NAME=$(basename "$APK_FILE")

          bash scripts/ci/r2-put.sh \
            "${R2_BUCKET}/releases/${TAG}/${APK_NAME}" \
            "$APK_FILE" \
            "application/vnd.android.package-archive" \
            "public, max-age=31536000, immutable"

          npx --yes "wrangler@4.112.0" r2 object get "${R2_BUCKET}/releases/latest.json" \
            --file /tmp/current-latest.json --remote 2>/dev/null || true

          if [ -f /tmp/current-latest.json ]; then
            APK_URL="${R2_BASE}/${APK_NAME}"
            LATEST_VERSION=$(jq -r '.version // empty' /tmp/current-latest.json)
            TAG_VERSION="${{ needs.preflight.outputs.version }}"
            if [[ ! "$LATEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::R2 updater manifest has an invalid version; refusing to patch it.'
              exit 1
            fi
            if [ "$LATEST_VERSION" != "$TAG_VERSION" ]; then
              echo "::notice::Updated the versioned APK, but left global latest (${LATEST_VERSION}) unchanged."
              exit 0
            fi
            jq --arg apk "$APK_URL" \
               '.apk_url = $apk | .android = ((.android // {}) + {status: "available", url: $apk})' \
               /tmp/current-latest.json > /tmp/updated-latest.json

            bash scripts/ci/r2-put.sh \
              "${R2_BUCKET}/releases/latest.json" \
              "/tmp/updated-latest.json" \
              "application/json" \
              "public, max-age=300"
          fi

      - name: Purge Cloudflare CDN cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          TAG="${{ needs.preflight.outputs.tag_name }}"
          APK_NAME=$(basename "$(find android-output -maxdepth 1 -name '*.apk' -type f | sort | head -1)")
          {
            echo "https://download.deepstudent.cn/releases/${TAG}/${APK_NAME}"
            echo "https://download.deepstudent.cn/releases/latest.json"
          } > /tmp/purge-urls.txt
          bash scripts/ci/purge-cdn.sh /tmp/purge-urls.txt
