# Check the same immutable source that the release builders will consume.
name: Verify Source CI (reusable)
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-ci:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Require successful CI on the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_CI_WAIT_MS: '60000'
        run: node scripts/ci/release-ci-gate.mjs
