name: Release PR
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: release-pr-main
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Reconcile labels for existing release tags
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state merged --label 'autorelease: pending' --json number,title \
            --jq '.[] | [.number,.title] | @tsv' | while IFS=$'\t' read -r number title; do
            if [[ "$title" =~ release\ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              tag="v${BASH_REMATCH[1]}"
              if [ -n "$(git ls-remote --tags "https://github.com/$GH_REPO.git" "refs/tags/$tag")" ]; then
                gh pr edit "$number" --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'
              fi
            fi
          done
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          # Use a GitHub App/fine-grained bot token to trigger PR CI without
          # GITHUB_TOKEN recursion/approval restrictions.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          skip-github-release: true

      - name: Resolve release PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh pr list --state open --base main --json headRefName --jq '[.[] | select(.headRefName | startswith("release-please--branches--main"))][0].headRefName // empty')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          fetch-depth: 0
      - name: Validate the release PR even when GITHUB_TOKEN suppresses PR events
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ steps.pr.outputs.branch }}
          BOT_TOKEN_CONFIGURED: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$BOT_TOKEN_CONFIGURED" != true ]; then
            SHA=$(git rev-parse HEAD)
            EXISTING=$(gh run list --workflow ci.yml --commit "$SHA" --limit 100 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "in_progress" or .conclusion == "success")] | .[0].databaseId // empty')
            if [ -n "$EXISTING" ]; then
              echo "CI for release PR $SHA already exists: run $EXISTING"
              exit 0
            fi
            gh workflow run ci.yml --ref "$PR_BRANCH"
          fi
