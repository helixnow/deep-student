# 热修某个 Release 的 Linux 产物（重建 + 替换 GitHub 资产 + 同步 R2 + 刷新 CDN）
#
# 审查 F5 修复：此前本 workflow 只替换 GitHub Release 资产，完全不碰 R2 镜像
# —— R2 的 latest.json 与走 CDN 的用户继续拿被替换前的旧文件（immutable 一年
# 缓存）。现在替换后同步上传 R2、修补 R2 latest.json 并自动 purge CDN。
#
# 构建走 reusable-build-linux.yml，与主发布共用同一实现。

name: Hotfix Linux Release Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要修复的 tag（例如 v0.9.30）；留空则默认使用当前 latest release"
        required: false
        default: ""
        type: string

concurrency:
  group: hotfix-linux-${{ github.event.inputs.tag_name || 'latest' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: deepstudent

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.pick.outputs.tag_name }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Resolve target tag
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [[ -n "$INPUT_TAG" ]]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME=$(gh api "repos/${GH_REPO}/releases/latest" -q '.tag_name')
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag: '$TAG_NAME'. Expected format like v0.9.30"
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "✅ Target release: $TAG_NAME"

  # 版本号三重校验（与 release / rebuild 共用）
  verify:
    needs: [resolve]
    uses: ./.github/workflows/reusable-verify-version.yml
    with:
      tag_name: ${{ needs.resolve.outputs.tag_name }}

  # Linux 构建（与 release / rebuild 共用）
  #
  # WI-4 兼容性说明：这里有意不传 frontend_dist_artifact。GitHub Actions
  # 的 artifact 只在同一 workflow run 内可见 —— 本 workflow 没有
  # build-frontend job，无法引用 release.yml 那次 run 上传的 frontend-dist。
  # 留空让 reusable-build-linux.yml 走回退路径：beforeBuildCommand 在构建
  # job 内完成前端构建（含 Sentry 前端 sourcemap 上传），产物与主发布路径
  # 等价（门禁一致，只是慢一些）。
  build-linux:
    needs: [verify]
    uses: ./.github/workflows/reusable-build-linux.yml
    with:
      tag_name: ${{ needs.verify.outputs.tag_name }}
      artifact_name: linux-hotfix-x86_64
    secrets: inherit

  replace-release-assets:
    needs: [resolve, verify, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GITHUB_REPO: ${{ github.repository }}
    steps:
      # workflow ref 的 checkout：提供 scripts/ci/*
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-hotfix-x86_64
          path: linux-artifact

      - name: Flatten Linux artifacts
        run: |
          mkdir -p linux-assets
          find linux-artifact -type f -exec mv {} linux-assets/ \;
          FILE_COUNT=$(find linux-assets -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "$FILE_COUNT" -eq 0 ]]; then
            echo "::error::Downloaded Linux artifact contained no files"
            exit 1
          fi
          echo "✅ Flattened ${FILE_COUNT} Linux artifact files"

      - name: Normalize artifact filenames
        run: |
          find linux-assets -type f -name '* *' | while IFS= read -r f; do
            DIR=$(dirname "$f")
            OLD=$(basename "$f")
            NEW=$(echo "$OLD" | tr ' ' '.')
            mv "$f" "$DIR/$NEW"
            echo "renamed: $OLD -> $NEW"
          done

      - name: Show Linux assets
        run: ls -lah linux-assets

      - name: Remove old Linux assets from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          gh release view "$TAG" --repo "$GITHUB_REPO" --json assets -q '.assets[].name' > old-assets.txt
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            if [[ "$name" == *.AppImage || "$name" == *.AppImage.sig || "$name" == *.AppImage.tar.gz || "$name" == *.AppImage.tar.gz.sig || "$name" == *.deb || "$name" == *.rpm ]]; then
              echo "Deleting old Linux asset: $name"
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPO" -y || true
            fi
          done < old-assets.txt

      - name: Upload new Linux assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          gh release upload "$TAG" linux-assets/* --repo "$GITHUB_REPO" --clobber
          echo "✅ Linux assets replaced in release $TAG"

      - name: Patch latest.json (linux-x86_64) and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          mkdir -p latest-json-tmp
          gh release download "$TAG" --repo "$GITHUB_REPO" --pattern latest.json --dir latest-json-tmp

          if [[ ! -f latest-json-tmp/latest.json ]]; then
            echo "⚠️ latest.json not found in release; skip patch"
            exit 0
          fi

          UPDATER=$(find linux-assets -maxdepth 1 -name "*_x86_64.AppImage" ! -name "*.sig" | head -1)
          [[ -z "$UPDATER" ]] && UPDATER=$(find linux-assets -maxdepth 1 -name "*_x86_64.AppImage.tar.gz" | head -1)
          [[ -z "$UPDATER" ]] && UPDATER=$(find linux-assets -maxdepth 1 -name "*.AppImage.tar.gz" | head -1)
          if [[ -z "$UPDATER" ]]; then
            echo "::error::No AppImage updater artifact found"
            exit 1
          fi

          SIG_FILE="${UPDATER}.sig"
          if [[ ! -f "$SIG_FILE" ]]; then
            echo "::error::No signature found for $(basename "$UPDATER")"
            exit 1
          fi

          UPDATER_NAME=$(basename "$UPDATER")
          SIGNATURE=$(cat "$SIG_FILE")
          URL="https://github.com/${GITHUB_REPO}/releases/download/${TAG}/${UPDATER_NAME}"

          jq --arg url "$URL" --arg sig "$SIGNATURE" '
            .platforms["linux-x86_64"] = {"url": $url, "signature": $sig}
          ' latest-json-tmp/latest.json > latest-json-tmp/latest.patched.json

          mv latest-json-tmp/latest.patched.json latest-json-tmp/latest.json

          gh release upload "$TAG" latest-json-tmp/latest.json --repo "$GITHUB_REPO" --clobber
          echo "✅ latest.json patched and replaced"

      # ── F5: 同步 R2 镜像（此前完全缺失，CDN 用户拿不到热修产物）──
      - name: Sync new Linux assets to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          FAILED_FILES=""
          for FILE in linux-assets/*; do
            NAME=$(basename "$FILE")
            case "$NAME" in
              *.sig)  CT="application/pgp-signature" ;;
              *.deb)  CT="application/vnd.debian.binary-package" ;;
              *.rpm)  CT="application/x-rpm" ;;
              *)      CT="application/octet-stream" ;;
            esac
            echo "  ⬆️ ${NAME} (${CT})"
            if ! bash scripts/ci/r2-put.sh \
              "${R2_BUCKET}/releases/${TAG}/${NAME}" \
              "$FILE" \
              "$CT" \
              "public, max-age=31536000, immutable"; then
              FAILED_FILES="${FAILED_FILES}${NAME}\n"
            fi
          done

          if [ -n "$FAILED_FILES" ]; then
            echo "❌ R2 upload finished with failures:"
            printf "%b" "$FAILED_FILES"
            exit 1
          fi
          echo "✅ Linux assets synced to R2"

      - name: Patch R2 latest.json (linux-x86_64)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          R2_BASE="https://download.deepstudent.cn/releases/${TAG}"

          npx wrangler r2 object get "${R2_BUCKET}/releases/latest.json" \
            --file /tmp/r2-latest.json --remote 2>/dev/null || true
          if [[ ! -f /tmp/r2-latest.json ]]; then
            echo "⚠️ Could not fetch R2 latest.json, skip patch"
            exit 0
          fi

          # 仅当 R2 latest.json 的版本与被热修的 tag 一致时才修补，
          # 避免把旧版本的 URL 写进更新端点。
          R2_VERSION=$(jq -r '.version' /tmp/r2-latest.json)
          if [[ "v${R2_VERSION}" != "$TAG" ]]; then
            echo "ℹ️ R2 latest.json is for v${R2_VERSION} (not ${TAG}), skip patch"
            exit 0
          fi

          UPDATER=$(find linux-assets -maxdepth 1 -name "*_x86_64.AppImage" ! -name "*.sig" | head -1)
          [[ -z "$UPDATER" ]] && UPDATER=$(find linux-assets -maxdepth 1 -name "*_x86_64.AppImage.tar.gz" | head -1)
          [[ -z "$UPDATER" ]] && UPDATER=$(find linux-assets -maxdepth 1 -name "*.AppImage.tar.gz" | head -1)
          if [[ -z "$UPDATER" || ! -f "${UPDATER}.sig" ]]; then
            echo "::error::AppImage updater artifact or signature missing for R2 latest.json patch"
            exit 1
          fi

          UPDATER_NAME=$(basename "$UPDATER")
          SIGNATURE=$(cat "${UPDATER}.sig")
          jq --arg url "${R2_BASE}/${UPDATER_NAME}" --arg sig "$SIGNATURE" '
            .platforms["linux-x86_64"] = {"url": $url, "signature": $sig}
          ' /tmp/r2-latest.json > /tmp/r2-latest.patched.json

          bash scripts/ci/r2-put.sh \
            "${R2_BUCKET}/releases/latest.json" \
            "/tmp/r2-latest.patched.json" \
            "application/json" \
            "public, max-age=300"
          echo "✅ R2 latest.json patched"

      # ── F5: 自动刷新 CDN（immutable 一年缓存 + 同名覆盖）──
      - name: Purge Cloudflare CDN cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          TAG="${{ needs.resolve.outputs.tag_name }}"
          BASE_URL="https://download.deepstudent.cn/releases/${TAG}"
          {
            for FILE in linux-assets/*; do
              echo "${BASE_URL}/$(basename "$FILE")"
            done
            echo "https://download.deepstudent.cn/releases/latest.json"
          } > /tmp/purge-urls.txt
          bash scripts/ci/purge-cdn.sh /tmp/purge-urls.txt
