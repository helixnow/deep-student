# Windows Electron release build (x64 NSIS + Authenticode + minisign)
name: Build Windows (reusable)

on:
  workflow_call:
    inputs:
      force_rebuild:
        default: false
        type: boolean
      source_sha:
        description: 'Immutable 40-char source commit SHA'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Release tag (e.g. v0.20.0)'
        required: true
        type: string
      allow_unsigned:
        description: 'Manual recovery only: allow skipping Authenticode signing'
        required: false
        type: boolean
        default: false
      frontend_dist_artifact:
        description: 'Prebuilt frontend dist artifact name; builds locally when empty'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  TIMESTAMP_URL_PRIMARY: http://timestamp.digicert.com
  TIMESTAMP_URL_FALLBACK: http://timestamp.sectigo.com

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      RELEASE_FORCE_REBUILD: ${{ inputs.force_rebuild }}
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: '--max-old-space-size=4096'
      ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
      ELECTRON_CUSTOM_DIR: '{{ version }}'
      ELECTRON_BUILDER_BINARIES_MIRROR: https://registry.npmmirror.com/-/binary/electron-builder-binaries/
    steps:
      - name: Preflight — require Authenticode and updater secrets (fail-closed)
        shell: bash
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          MISSING=""
          for VAR in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then MISSING="${MISSING} ${VAR}"; fi
          done
          if [ "$ALLOW_UNSIGNED" != "true" ]; then
            for VAR in WINDOWS_CERTIFICATE_BASE64 WINDOWS_CERTIFICATE_PASSWORD; do
              if [ -z "${!VAR}" ]; then MISSING="${MISSING} ${VAR}"; fi
            done
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Windows release build missing required secrets:${MISSING}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || inputs.tag_name }}

      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/ci
            .github/actions

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Verify pinned release source before installing dependencies
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs source

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Install Electron binary
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "electron download failed (attempt ${attempt}/3), retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Download prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.frontend_dist_artifact }}
          path: dist

      - name: Verify prebuilt frontend dist
        if: ${{ inputs.frontend_dist_artifact != '' }}
        shell: bash
        run: |
          test -f dist/index.html || { echo "::error::Prebuilt frontend dist missing index.html"; exit 1; }
          echo "Prebuilt frontend dist ready ($(find dist -type f | wc -l | tr -d ' ') files)"

      - name: Verify prebuilt frontend identity and contents
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-check --dir dist

      - name: Build frontend locally (fallback)
        if: ${{ inputs.frontend_dist_artifact == '' }}
        run: npm run build

      - name: Package Windows Electron installer
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          for attempt in 1 2 3; do
            if node electron/scripts/package.mjs --win --x64; then exit 0; fi
            echo "packaging failed (attempt ${attempt}/3), retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Verify fuses and asar integrity
        run: node electron/scripts/verify-fuses.mjs --win

      - name: Authenticode sign NSIS installer (signtool + timestamp + verify)
        if: ${{ !inputs.allow_unsigned }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) {
            Write-Host "::error::signtool.exe not found in Windows SDK"
            exit 1
          }
          Write-Host "signtool: $($signtool.FullName)"

          $installers = Get-ChildItem "release/*-setup.exe" -ErrorAction SilentlyContinue
          if (-not $installers -or $installers.Count -ne 1) {
            Write-Host "::error::Expected exactly 1 NSIS installer under release/, found $($installers.Count)"
            exit 1
          }
          $installer = $installers[0].FullName
          Write-Host "Installer: $installer"

          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-signing-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          if ((Get-Item $pfxPath).Length -eq 0) {
            Write-Host "::error::WINDOWS_CERTIFICATE_BASE64 decoded to an empty file"
            exit 1
          }

          try {
            $signed = $false
            foreach ($tsUrl in @($env:TIMESTAMP_URL_PRIMARY, $env:TIMESTAMP_URL_FALLBACK)) {
              Write-Host "Signing with timestamp server: $tsUrl"
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr $tsUrl `
                /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer
              if ($LASTEXITCODE -eq 0) { $signed = $true; break }
              Write-Host "::warning::signtool sign failed with $tsUrl (exit $LASTEXITCODE), trying fallback..."
            }
            if (-not $signed) {
              Write-Host "::error::Authenticode signing failed with all timestamp servers"
              exit 1
            }

            & $signtool.FullName verify /pa /v $installer
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::signtool verify /pa failed — installer signature is not valid"
              exit 1
            }
            Write-Host "Authenticode signature + timestamp verified"
          }
          finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Sign updater installer with minisign (after Authenticode)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXE=$(find release -maxdepth 1 -name '*-setup.exe' ! -name '*.sig' | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::NSIS installer not found for updater signing"
            exit 1
          fi
          node .release-tooling/scripts/ci/sign-updater.mjs "$EXE"
          test -s "${EXE}.sig"

      - name: Verify updater installer and signature exist
        shell: bash
        run: |
          set -euo pipefail
          EXE_COUNT=$(find release -maxdepth 1 -name '*-setup.exe' ! -name '*.sig' | wc -l | tr -d ' ')
          SIG_COUNT=$(find release -maxdepth 1 -name '*-setup.exe.sig' | wc -l | tr -d ' ')
          if [ "$EXE_COUNT" -ne 1 ] || [ "$SIG_COUNT" -ne 1 ]; then
            echo "::error::Expected 1 *-setup.exe + 1 .sig, got ${EXE_COUNT}/${SIG_COUNT}"
            ls -la release/ || true
            exit 1
          fi

      - name: Stage Windows release deliverables
        shell: bash
        run: |
          mkdir -p windows-output
          cp release/*-setup.exe windows-output/
          cp release/*-setup.exe.sig windows-output/

      - name: Record locally built frontend identity
        if: ${{ inputs.source_sha != '' && inputs.frontend_dist_artifact == '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-write --dir dist

      - name: Record release asset provenance
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        env:
          RELEASE_TARGET: x86_64-pc-windows-msvc
          RELEASE_ARTIFACT_DIR: windows-output
        run: >-
          node .release-tooling/scripts/ci/release-contracts.mjs provenance-write
          --target "$RELEASE_TARGET" --dir "$RELEASE_ARTIFACT_DIR"
          --output "$RUNNER_TEMP/release-provenance.json"

      - name: Upload release asset provenance
        if: ${{ inputs.source_sha != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-provenance-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
          overwrite: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          overwrite: true
          name: windows-x86_64
          retention-days: 30
          compression-level: 0
          path: windows-output/*

      - uses: ./.release-tooling/.github/actions/release-checkpoint
        if: inputs.source_sha != ''
        with:
          stage: windows
          policy: ${{ inputs.allow_unsigned }}
