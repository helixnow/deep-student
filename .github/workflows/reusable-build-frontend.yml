# Build the production frontend dist once and distribute via artifact (reusable)
name: Build Frontend (reusable)

on:
  workflow_call:
    inputs:
      source_sha:
        description: 'Immutable 40-char source commit SHA'
        required: false
        type: string
        default: ''
      tag_name:
        description: 'Release tag (e.g. v0.20.0)'
        required: true
        type: string
      artifact_name:
        description: 'Uploaded frontend artifact name'
        required: false
        type: string
        default: frontend-dist

permissions:
  contents: read

env:
  SENTRY_CLI_VERSION: '2.58.6'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      NODE_OPTIONS: '--max-old-space-size=8192'
      SENTRY_UPLOAD_ENABLED: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || inputs.tag_name }}

      - name: Checkout release tooling from workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: |
            scripts/ci
            .github/actions

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Verify pinned release source before installing dependencies
        if: ${{ inputs.source_sha != '' }}
        shell: bash
        run: node .release-tooling/scripts/ci/release-contracts.mjs source

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Sentry CLI (pinned)
        if: ${{ env.SENTRY_UPLOAD_ENABLED == 'true' }}
        run: npm install --global "@sentry/cli@${SENTRY_CLI_VERSION}"

      - name: Generate version info
        run: node scripts/generate-version.mjs

      - name: Build frontend (vite)
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ secrets.SENTRY_AUTH_TOKEN != '' && secrets.SENTRY_ORG != '' && secrets.SENTRY_PROJECT != '' && '1' || '0' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run build

      - name: Execute production entry and initial React render
        run: node .release-tooling/scripts/ci/check-frontend-startup.mjs

      - name: Verify dist output (no sourcemap leak)
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::vite build produced no dist/index.html"; exit 1; }
          MAP_COUNT=$(find dist -name '*.map' | wc -l | tr -d ' ')
          if [ "$MAP_COUNT" -ne 0 ]; then
            echo "::error::dist contains ${MAP_COUNT} .map file(s) — source maps must never ship inside installers"
            find dist -name '*.map'
            exit 1
          fi
          echo "dist ready: $(du -sh dist | cut -f1), $(find dist -type f | wc -l | tr -d ' ') files, no .map"

      - name: Record frontend identity and contents
        if: ${{ inputs.source_sha != '' }}
        run: node .release-tooling/scripts/ci/release-contracts.mjs frontend-write --dir dist

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_name }}
          overwrite: true
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - uses: ./.release-tooling/.github/actions/release-checkpoint
        if: inputs.source_sha != '' && inputs.artifact_name == 'frontend-dist'
        with:
          stage: frontend
