name: Bug Report | 缺陷报告
description: Report a reproducible bug in DeepStudent
title: "[Bug]: "
labels: ["bug", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill out the details below so maintainers can reproduce and fix it quickly.
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x64)
        - Windows (x64)
        - Linux (AppImage / deb)
        - Android
        - iOS
        - WebUI / PWA (Self-hosted)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version / 应用版本
      placeholder: e.g. v0.20.10
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce / 复现步骤
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or Logs / 截图或日志
      description: Please redact any API keys or personal tokens before pasting logs.
      render: text
