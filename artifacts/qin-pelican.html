<script>
(() => {
  const art = document.getElementById('art');
  const pause = document.getElementById('pause');
  const pauseLabel = document.getElementById('pause-label');
  const pauseIcon = document.getElementById('pause-icon');
  const theme = document.getElementById('theme');
  const themeLabel = document.getElementById('theme-label');
  const themeIcon = document.getElementById('theme-icon');
  const speed = document.getElementById('speed');
  const speedOutput = document.getElementById('speed-output');
  const status = document.getElementById('status');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const mobile = matchMedia('(max-width: 760px)');
  let paused = reducedMotion.matches;
  let night = false;
  let rate = 1;

  // Control existing CSS animations with WAAPI: changing speed preserves the
  // current frame; pausing freezes wings, landscape, fabric and clouds together.
  const animations = () => art.getAnimations({ subtree: true }).filter(animation => animation instanceof CSSAnimation);
  function synchronizePlayback() {
    for (const animation of animations()) {
      animation.updatePlaybackRate(rate);
      if (paused || document.hidden) animation.pause();
      else animation.play();
    }
    pause.setAttribute('aria-pressed', String(paused));
    pause.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    pauseLabel.textContent = paused ? '继续御风' : '暂歇片刻';
    pauseIcon.setAttribute('d', paused ? 'M6 3L16 10L6 17Z' : 'M7 4V16M13 4V16');
  }
  function fitScene() {
    // Keep the entire pelican and rider visible on portrait screens.
    art.setAttribute('viewBox', mobile.matches ? '275 -170 1020 1320' : '0 0 1440 900');
    art.setAttribute('preserveAspectRatio', mobile.matches ? 'xMidYMid meet' : 'xMidYMid slice');
  }
  pause.addEventListener('click', () => {
    paused = !paused;
    synchronizePlayback();
    status.textContent = paused ? '动画已暂停。' : '继续御风飞行。';
  });
  theme.addEventListener('click', () => {
    night = !night;
    document.body.classList.toggle('night', night);
    theme.setAttribute('aria-pressed', String(night));
    theme.setAttribute('aria-label', night ? '切换为晴昼' : '切换为月夜');
    themeLabel.textContent = night ? '换作晴昼' : '换作月夜';
    themeIcon.setAttribute('d', night ? 'M10 1V3M10 17V19M1 10H3M17 10H19M3.6 3.6L5 5M15 15L16.4 16.4M3.6 16.4L5 15M15 5L16.4 3.6M14 10A4 4 0 1 1 6 10A4 4 0 1 1 14 10' : 'M16.5 12A7 7 0 0 1 8 3.5A7 7 0 1 0 16.5 12Z');
    status.textContent = night ? '月夜，星河在上。' : '晴昼，山河在下。';
  });
  speed.addEventListener('input', () => {
    rate = Number(speed.value);
    speedOutput.value = rate.toFixed(2).replace(/0$/, '') + '×';
    speed.setAttribute('aria-valuetext', rate + ' 倍速度');
    synchronizePlayback();
  });
  document.addEventListener('visibilitychange', synchronizePlayback);
  reducedMotion.addEventListener('change', () => { paused = reducedMotion.matches; synchronizePlayback(); });
  mobile.addEventListener('change', fitScene);
  fitScene();
  synchronizePlayback();
})();
</script>
