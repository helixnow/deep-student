[package]
name = "dstu-security"
version = "0.0.0"
description = "Deep Student 安全存储与加密：加密服务与备份加密格式、恢复密钥发布 journal、跨平台凭据安全存储（不依赖 tauri）"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "base"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
aes-gcm = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true }
hostname = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# secure_store 根种子平台密钥库（opt-in）：只在 macOS/Linux 编译；features 与 app 一致
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }
