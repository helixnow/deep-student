[package]
name = "dstu-mcp"
version = "0.0.0"
description = "Deep Student MCP 与外部工具能力：MCP 客户端（stdio/SSE/Streamable HTTP/WebSocket 传输、OAuth 授权、全局客户端）、工具注册表与 web_search 外部搜索"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "capability"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-kernel = { workspace = true }
dstu-llm = { workspace = true }
dstu-security = { workspace = true }
dstu-storage = { workspace = true }
dstu-util = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
backon = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
dashmap = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
lru = { workspace = true }
quick-xml = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32 → JSON 数字按十进制字符串转换）。
# web_search 的结果分数（f32）等会序列化进 JSON；显式声明，保证 `cargo test -p dstu-mcp`
# 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

# OAuth2 在 Android 上暂不支持（会引入 native-tls），与 app 相同的目标门控。
[target.'cfg(not(target_os = "android"))'.dependencies]
oauth2 = { workspace = true }

[dev-dependencies]
# mcp::auth 测试使用临时目录。
tempfile = { workspace = true }

[features]
# 与 app 的 default profile 保持一致：单独 `cargo test -p dstu-mcp` 也覆盖 mcp 模块。
# app 以 default-features = false 依赖本 crate，并由自身的 `mcp` feature 转发。
default = ["mcp"]
# 可选：MCP 客户端与 rmcp 校验（app 的 `mcp` 转发到这里）
mcp = []
# 仅为消除条件编译告警：不产生实际功能影响（app 的 `http` 转发到这里）
http = []
