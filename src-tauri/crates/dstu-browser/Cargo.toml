[package]
name = "dstu-browser"
version = "0.0.0"
description = "Deep Student Workbench 内置浏览器：BrowserService（session/导航/下载/双闸）、content WebView、注入桥、browser.db 仓储与导航策略，以及 browser_* Tauri 命令"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "domain"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-kernel = { workspace = true }
dstu-storage = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
rand = { workspace = true }
# 可选：browser.db 内嵌迁移（app 的 `data_governance` 转发到这里）
refinery = { workspace = true, optional = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32/f64 → JSON 数字按十进制字符串转换）。
# 浏览器快照/滚动/尺寸等 f64 会序列化进 JSON；显式声明，保证 `cargo test -p dstu-browser`
# 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2 = { workspace = true }
# 与 app 相同的 tauri feature（macos-private-api / protocol-asset / unstable）：建 content WebView 需要。
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# macOS：content surface 裁剪（cocoa/objc）与注入桥 WKWebView evaluateJavaScript（objc2 系）
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { workspace = true }
objc = { workspace = true }
objc2 = { workspace = true }
block2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-web-kit = { workspace = true }

# Linux：注入桥 WebKitGTK evaluate_javascript
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { workspace = true }
javascriptcore-rs = { workspace = true }

# Windows：注入桥 WebView2 ExecuteScript
[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true }

[dev-dependencies]
# database / repository 测试使用临时目录。
tempfile = { workspace = true }

[features]
# 与 app 的 default profile 保持一致：单独 `cargo test -p dstu-browser` 也覆盖 browser.db 迁移。
# app 以 default-features = false 依赖本 crate，并由自身的 `data_governance` feature 转发。
default = ["data_governance"]
# 数据治理（browser.db Refinery 内嵌迁移；关闭时只 warn 并跳过建表，与 app 原行为一致）
data_governance = ["refinery"]
