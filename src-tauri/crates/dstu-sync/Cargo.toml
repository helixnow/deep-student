[package]
name = "dstu-sync"
version = "0.0.0"
description = "Deep Student 同步与备份域：云存储（WebDAV/S3/FTP、ZIP 备份上传下载、delta 快照、租约/坏对象隔离）、云配置 SSOT 与凭据 hydrate、备份任务管理器、数据治理的备份管理器（BackupManager）与记录级同步引擎（SyncManager）"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "domain"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-kernel = { workspace = true }
dstu-security = { workspace = true }
dstu-storage = { workspace = true }
dstu-vfs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
roxmltree = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32/f64 → JSON 数字按十进制字符串转换）。
# 备份清单/同步载荷会序列化 JSON 数字；显式声明，保证 `cargo test -p dstu-sync`
# 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2 = { workspace = true }
# 与 app 相同的 tauri feature：云存储/备份命令收 AppHandle 并 emit 进度事件。
tauri = { workspace = true }
# 生产代码也用临时文件（delta 上传/恢复、FTP/云下载落盘），不能只放 dev。
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
zeroize = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }
# FTP/FTPS（`cloud_storage::ftp`，非 Android 编译；依赖声明与 app 一致保持无条件）
suppaftp = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# S3 后端（`cloud_storage_s3` feature）
aws-sdk-s3 = { workspace = true, optional = true }

[dev-dependencies]
# 单测使用 `crate::vfs::database::setup_migrated_test_db`。
dstu-vfs = { workspace = true, features = ["test-util"] }
# cloud_storage::webdav 单测的进程内假 WebDAV 服务器。
hyper = { workspace = true }

[features]
# 与 app 的默认 profile 一致（app 依赖本 crate 时 default-features = false，并由 app 的
# `cloud_storage_s3` / `data_governance` feature 转发）。
default = ["cloud_storage_s3", "data_governance"]
# S3 后端；关闭时 `is_s3_enabled() == false`，`create_storage` 对 S3 返回稳定错误码。
cloud_storage_s3 = ["dep:aws-sdk-s3"]
# 数据治理：`data_governance` 模块（备份管理器 / 同步引擎）及其内部条件编译。
data_governance = ["dstu-storage/data_governance"]
