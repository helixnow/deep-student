[package]
name = "dstu-research"
version = "0.0.0"
description = "Deep Student 研究域：Insight Recall v2 灵感库（采集/认领/纠正/墓碑、召回与披露阶梯、巩固任务队列）与 HPIAS 深度研究 pipeline（事件 emit、检索后端、LLM 综合）"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "domain"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-llm = { workspace = true }
dstu-storage = { workspace = true }
dstu-vfs = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
nanoid = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32 → JSON 数字按十进制字符串转换）。
# hpias 的检索命中分数等会序列化进 JSON；显式声明，保证 `cargo test -p dstu-research`
# 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tauri = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# insight::tests 的迁移夹具：VFS 库（`vfs::database::setup_migrated_test_db`）与
# mistakes 库（`data_governance::migration` = `dstu_storage::migration`，按 feature 门控）。
dstu-storage = { workspace = true, features = ["data_governance"] }
dstu-vfs = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
