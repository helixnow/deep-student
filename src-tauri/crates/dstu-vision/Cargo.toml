[package]
name = "dstu-vision"
version = "0.0.0"
description = "Deep Student 视觉/文档理解能力：页面栅格化、VLM 题目定位、跨页合并、插图裁切、LLM 结构化、PDF OCR 服务与题目集识别会话服务"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "capability"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-docs = { workspace = true }
dstu-llm = { workspace = true }
dstu-storage = { workspace = true }
dstu-util = { workspace = true }
dstu-vfs = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
image = { workspace = true }
log = { workspace = true }
nanoid = { workspace = true }
pdfium-render = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32 → JSON 数字按十进制字符串转换）。
# VLM 请求体 / OCR 进度事件等会序列化进 JSON；显式声明，保证 `cargo test -p dstu-vision`
# 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2 = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
