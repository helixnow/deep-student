[package]
name = "dstu-notes"
version = "0.0.0"
description = "Deep Student 笔记域服务：NotesManager（笔记 CRUD、链接/标签、Canvas 结构操作、Lance 全文索引）与笔记导入导出（NotesExporter / NotesImporter：Markdown/ZIP、资产与历史）"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "domain"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-storage = { workspace = true }
dstu-vfs = { workspace = true }
chrono = { workspace = true }
# notes_manager 的 Lance 全文检索分支使用（`lance` feature 内）；dstu-vfs 已无条件引入。
futures-util = { workspace = true }
log = { workspace = true }
pulldown-cmark = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32 → JSON 数字按十进制字符串转换）。
# 显式声明，保证 `cargo test -p dstu-notes` 单独编译时与在 app 中的行为一致；
# 特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
# notes_manager 的 Lance 分支用 `tauri::async_runtime`（`lance` feature 内）；dstu-vfs 已无条件引入。
tauri = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }
# LanceDB 全文索引后端（`lance` feature）。
lancedb = { workspace = true, optional = true }
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }

[dev-dependencies]
# notes_exporter 单测使用 `crate::vfs::database::setup_migrated_test_db`。
dstu-vfs = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[features]
# 与 app 的默认 profile 一致（app 依赖本 crate 时 default-features = false，并由 app 的
# `lance` feature 转发）。
default = ["lance"]
# LanceDB 全文索引后端；同时打开 dstu-vfs 的 `lance`（`lance_vector_store` 辅助函数）。
lance = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dstu-vfs/lance"]
