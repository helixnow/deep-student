[package]
name = "dstu-util"
version = "0.0.0"
description = "Deep Student 通用工具：token 预算、SSE 缓冲与流式 UTF-8 解码、受限远程抓取、文本处理（不依赖 tauri）"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "base"

[lints]
workspace = true

[features]
# 精确 tokenizer（app 的 tokenizer_tiktoken feature 转发到这里）
tokenizer_tiktoken = ["tiktoken-rs"]

[dependencies]
dstu-core = { workspace = true }
# base64 / image / qrcode：`qr`（二维码 PNG base64，ilink_bot 与 B 站扫码登录共用）
base64 = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
log = { workspace = true }
qrcode = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tiktoken-rs = { workspace = true, optional = true }
tracing = { workspace = true }
