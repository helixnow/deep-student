[package]
name = "dstu-qbank"
version = "0.0.0"
description = "Deep Student 题库域服务层：题目集服务、出题/录题（authoring）、导入导出、AI 出题与评判、练习与组卷、复习计划、旧数据收敛"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "domain"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-docs = { workspace = true }
dstu-kernel = { workspace = true }
dstu-learning = { workspace = true }
dstu-llm = { workspace = true }
dstu-platform = { workspace = true }
dstu-storage = { workspace = true }
dstu-util = { workspace = true }
dstu-vfs = { workspace = true }
dstu-vision = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
docx-rs = { workspace = true }
encoding_rs = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
log = { workspace = true }
nanoid = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32 → JSON 数字按十进制字符串转换）。
# 题目/评判结果/出题任务等会序列化进 JSON；显式声明，保证 `cargo test -p dstu-qbank`
# 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启，不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2 = { workspace = true }
tauri = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# 单测按原路径 `crate::vfs::database::setup_migrated_test_db` 取迁移好的 VFS 测试库。
dstu-vfs = { workspace = true, features = ["test-util"] }
# 单测按原路径 `crate::mastery::service::set_now_override_ms` 覆盖 mastery 事件时钟。
dstu-learning = { workspace = true, features = ["test-util"] }
# 测试内起本地 HTTP server（hyper）/ mockito / 临时目录。
hyper = { workspace = true }
mockito = "1.0"
tempfile = { workspace = true }
