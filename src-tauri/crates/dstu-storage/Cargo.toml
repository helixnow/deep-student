[package]
name = "dstu-storage"
version = "0.0.0"
description = "Deep Student 存储层：主数据库与连接池、数据空间/设备身份、文件与统一文件管理、分块上传、迁移协调与 schema 注册表、审计、删除 journal、LLM 用量统计"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "infra"

[lints]
workspace = true

[dependencies]
dstu-core = { workspace = true }
dstu-kernel = { workspace = true }
dstu-platform = { workspace = true }
dstu-security = { workspace = true }
dstu-util = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
log = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
rand = { workspace = true }
refinery = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tauri = { workspace = true }
tauri-plugin-fs = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }

# unix：backup_common 用 statvfs 查询可用磁盘空间（#[cfg(unix)]）。
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# 测试只用 tempfile（已是普通依赖）；无 mockito/proptest。

[features]
# 与 app 的 profile 组合保持一致：`data_space::startup_health` 等按该 feature 门控。
default = ["data_governance"]
# 数据治理能力开关（app 的 `data_governance` 转发到这里）。refinery 被
# `llm_usage::database` 的 embed_migrations! 无条件使用，因此不是可选依赖；
# 该 feature 只保留 data_space 侧的条件编译语义。
data_governance = []
