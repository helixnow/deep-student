[package]
name = "dstu-testkit"
version = "0.0.0"
description = "Deep Student 共享测试夹具（只作 dev-dependency / test-util feature 使用）：按生产迁移路径建好 schema 的临时数据库目录"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# 只依赖 dstu-storage（infra）。dstu-vfs 的 `test-util` feature 以可选普通依赖引用它，
# 因此层级不能高于 service；放在 infra，同层依赖 dstu-storage。
[package.metadata.dstu]
layer = "infra"

[lints]
workspace = true

# 本 crate 只提供夹具，没有自己的测试；不生成空的测试程序（Windows 下链接 tauri 的
# 测试程序还需要额外的清单依赖，见 dstu-vfs/build.rs）。
[lib]
test = false
doctest = false

[dependencies]
dstu-storage = { workspace = true, features = ["data_governance"] }
tempfile = { workspace = true }
