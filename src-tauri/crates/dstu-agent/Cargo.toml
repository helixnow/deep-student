[package]
name = "dstu-agent"
version = "0.0.0"
description = "Deep Student Agent 层：chat_v2 编排引擎（pipeline / 工具环 / 执行器框架 / 审批 / 工作区 / 技能），域执行器由 app 经 ExecutorRoster 注入"
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.dstu]
layer = "agent"

[lints]
workspace = true

# app 以 default-features = false 依赖本 crate，并原样转发下列 feature（default 与 mobile-slim 等价）。
# default 与 app 的 default profile 一致，保证单独 `cargo test -p dstu-agent` 覆盖相同的条件编译分支。
[features]
default = ["mcp", "lance", "tokenizer_tiktoken", "data_governance"]
# MCP 客户端（`crate::mcp` 别名与 adapters/pipeline 里的 `cfg(feature = "mcp")` 分支）
mcp = ["dstu-mcp/mcp"]
# LanceDB 向量后端（本 crate 无 cfg 分支；转发到 dstu-vfs，与 app 的 `lance` 一致）
lance = ["dstu-vfs/lance"]
# 精确 tokenizer（`pipeline/token_resources.rs` 的 `precise` 标记 + dstu-util 的 tiktoken 实现）
tokenizer_tiktoken = ["dstu-util/tokenizer_tiktoken"]
# 数据治理（`crate::data_governance` 别名：file_deletion_queue / migration / schema_registry）
data_governance = ["dstu-storage/data_governance"]

[dependencies]
dstu-agent-api = { workspace = true }
dstu-core = { workspace = true }
dstu-docs = { workspace = true }
dstu-kernel = { workspace = true }
dstu-llm = { workspace = true }
dstu-mcp = { workspace = true }
dstu-memory = { workspace = true }
dstu-platform = { workspace = true }
dstu-security = { workspace = true }
dstu-storage = { workspace = true }
dstu-util = { workspace = true }
dstu-vfs = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
csv = { workspace = true }
dashmap = { workspace = true }
dirs = { workspace = true }
encoding_rs = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hostname = { workspace = true }
html2text = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
nanoid = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
# app 图里 starlark 打开了 arbitrary_precision（f32 → JSON 数字按十进制字符串转换，如 0.7 而非
# 0.699999988079071）。pipeline 请求体（temperature / top_p 等）依赖这一点；显式声明，保证
# `cargo test -p dstu-agent` 单独编译时与在 app 中的行为一致。特性本来就已在 app 中合并开启
# （本 crate 也直接依赖 starlark），不改变产品行为。
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sha2 = { workspace = true }
starlark = { workspace = true }
tauri = { workspace = true }
tauri-plugin-notification = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
hyper = { workspace = true }
mockito = "1.0"
env_logger = "0.11.11"
# 单测按原路径 `crate::memory::test_support::setup_memory_service` 与
# `MemoryService::fail_next_idempotent_write_before_receipt`（拆分前的 cfg(test) 项）。
dstu-memory = { workspace = true, features = ["test-util"] }
