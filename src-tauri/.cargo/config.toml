[build]
# rustc-wrapper = "sccache"  # Windows 开发环境临时禁用

# 代理必须由开发机或 CI 环境注入，例如 CARGO_HTTP_PROXY / HTTPS_PROXY。
# 不要在仓库配置中写入本机端口，否则干净 runner 无法下载依赖。

# Windows 本地编译链接器配置 - 解决内存不足问题
# /PDBPAGESIZE:16384：debug PDB 超过默认 4GB 上限会 LNK1140（勿用 /PDB:NONE，会生成名为 NONE 的垃圾文件）
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/INCREMENTAL:NO", "-C", "link-arg=/STACK:16777216", "-C", "link-arg=/PDBPAGESIZE:16384"]
# 注意：macOS 交叉编译时 cargo-xwin 会自动配置链接器，无需手动设置 linker

[target.x86_64-unknown-linux-gnu]
linker = "clang"
# lld 仅在开发机已安装时通过环境变量启用，避免 CI / 干净 runner 链接失败：
#   export RUSTFLAGS="-C link-arg=-fuse-ld=lld"

# macOS: uncomment to speed up link & debug info handling
# [target.x86_64-apple-darwin]
# rustflags = ["-C","link-arg=-Wl,-dead_strip"]
# [target.aarch64-apple-darwin]
# rustflags = ["-C","link-arg=-Wl,-dead_strip"]

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
lto = false

[profile.dev.package."*"]
opt-level = 0


# Android NDK 配置请通过环境变量注入（见 scripts/build_android.sh）
