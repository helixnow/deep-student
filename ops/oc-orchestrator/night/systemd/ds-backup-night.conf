# Installs as /etc/systemd/system/ds-backup.service.d/z-night.conf: keep the half-hourly backup from competing with tests.
# TimeoutStartSec is 30 min (ops/ser38 had 10): the .oc-runs archive alone is >600 MB and a killed run leaves no snapshot.
[Service]
CPUQuota=100%
MemoryMax=2G
TasksMax=64
IOWeight=10
TimeoutStartSec=30min
