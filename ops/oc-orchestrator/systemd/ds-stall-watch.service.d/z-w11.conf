# Installs as /etc/systemd/system/ds-stall-watch.service.d/z-w11.conf (sorts after v3.conf, so this ExecStart wins).
# --digest-min 100000 keeps the v3 rule (no inbox digests); --auto-restart-min 30 restarts an executor stalled 30 minutes,
# at most twice per lane in 3 hours, then tells its coordinator once (lib/stall-policy.mjs).
[Service]
ExecStart=
ExecStart=/opt/node26/bin/node /home/dsdev/dev/deep-student/scripts/electron-migration/stall-watch.mjs --threshold-sec 90 --interval-sec 15 --digest-min 100000 --auto-restart-min 30
