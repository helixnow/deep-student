# 本地 WebDAV + S3 (MinIO) + FTP 同步测试环境
# 启动: npm run dstu-test:cloud:up   （等价于 CI Cloud Provider Contract Gate 的启动序列）
# 停止: npm run dstu-test:cloud:down
# 本文件是 provider contract 环境的唯一事实源，CI 与本地 npm script 都直接使用它；
# dstu-test/docker/docker-compose.sync-test.yml 仅通过 Compose include 引用本文件。

# 固定 project name，使两个入口共享同一组容器与 volume，
# 避免 down --volumes 只清理其中一侧。
name: deep-student-sync-test

services:
  # ============== MinIO (S3 兼容) ==============
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ds-minio
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # MinIO Console (Web UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # 自动创建 bucket
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ds-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb local/deep-student --ignore-existing;
      mc anonymous set none local/deep-student;
      echo '✅ Bucket deep-student created';
      "

  # ============== WebDAV ==============
  webdav:
    image: bytemark/webdav:2.4
    container_name: ds-webdav
    ports:
      - "127.0.0.1:8080:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: webdav
      PASSWORD: webdav123
    volumes:
      - webdav_data:/var/lib/dav
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://webdav:webdav123@127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ============== FTP ==============
  ftp:
    build:
      context: ../../dstu-test/docker
      dockerfile: Dockerfile.ftp
    image: deep-student-sync-test-ftp:pyftpdlib-2.2.0
    container_name: ds-ftp
    ports:
      - "127.0.0.1:2121:21"     # FTP 控制端口
      - "127.0.0.1:30000-30009:30000-30009"  # 被动模式数据端口
    environment:
      FTP_USER_NAME: ftpuser
      FTP_USER_PASS: ftpuser123
      FTP_USER_HOME: /home/ftpuser
      PUBLICHOST: localhost
      FTP_MAX_CLIENTS: 50
      FTP_PASSIVE_PORTS: "30000:30009"
    volumes:
      - ftp_data:/home/ftpuser/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',21),3); assert s.recv(3)==b'220'"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  minio_data:
  webdav_data:
  ftp_data:
